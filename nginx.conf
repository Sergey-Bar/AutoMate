# Automate — nginx reverse proxy configuration (unified stack)
# Routes:
#   /api/  → api:3000  (Hono API)
#   /      → web:80    (React SPA)

# ─────────────────────────────────────────────────────────────────────────────
# Upstream definitions
# ─────────────────────────────────────────────────────────────────────────────
upstream api_backend {
    server api:3000;
    keepalive 16;
}

upstream web_backend {
    server web:80;
    keepalive 16;
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTP server
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Logging ────────────────────────────────────────────────────────────────
    access_log  /var/log/nginx/qace-access.log  combined;
    error_log   /var/log/nginx/qace-error.log   warn;

    # ── General settings ───────────────────────────────────────────────────────
    client_max_body_size 50m;

    # ── Gzip compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/ttf
        font/opentype
        image/svg+xml
        image/vnd.microsoft.icon;

    # ── Standard proxy headers (shared) ───────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # ── Timeouts ───────────────────────────────────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── Buffer settings ────────────────────────────────────────────────────────
    proxy_buffering    on;
    proxy_buffer_size  4k;
    proxy_buffers      8 16k;

    # ─────────────────────────────────────────────────────────────────────────
    # API proxy — /api/ → api:3000
    # ─────────────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow streaming AI responses
        proxy_buffering    off;
        proxy_read_timeout 120s;

        # Connection keep-alive
        proxy_set_header Connection "";
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Web SPA — catch-all (must be last)
    # Serves the React SPA; all unmatched paths fall through to web:80.
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://web_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}