name: Install static-analysis scanners
description: >-
  Puts `semgrep` and `gitleaks` on PATH at pinned versions, so
  `pnpm security:static` (scripts/static-analysis.mjs) can actually run them.

  `scripts/static-analysis.mjs` treats an absent scanner as `not_configured` and
  exits non-zero, on the reasoning that an unrun security scan is not a pass.
  Before this action existed, the `security` job in unified-ci.yml and every job
  in nightly.yml installed neither binary — so both workflows failed on their
  first step and never reached the secret scan, licence check, duplication,
  complexity, or capability-register steps queued behind it. The gates were red
  by construction.

  `scripts/lib/gate-tooling.test.mjs` asserts that any job running a script
  listed in `scripts/gate-tooling.json` with a `semgrep`/`gitleaks`
  requirement calls this action, so the wiring cannot silently regress.

inputs:
  semgrep-version:
    description: Pinned semgrep version, installed from PyPI.
    required: false
    default: 1.178.0
  gitleaks-version:
    description: Pinned gitleaks version, from its GitHub release.
    required: false
    default: 8.30.1
  gitleaks-linux-sha256:
    description: >-
      Checksum of the linux_x64 gitleaks archive, verified before the binary is
      trusted. Pinned here so a tampered download fails instead of scanning.
    required: false
    default: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

runs:
  using: composite
  steps:
    # semgrep ships no release binary; PyPI and the semgrep container are its
    # official distributions. setup-python puts the install directory on PATH,
    # so `semgrep` resolves in the same step that verifies it below.
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'

    - name: Install semgrep ${{ inputs.semgrep-version }}
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --disable-pip-version-check --no-input "semgrep==${{ inputs.semgrep-version }}"
        semgrep --version

    - name: Install gitleaks ${{ inputs.gitleaks-version }}
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        GITLEAKS_SHA256: ${{ inputs.gitleaks-linux-sha256 }}
      run: |
        set -euo pipefail
        version="${GITLEAKS_VERSION}"
        archive="gitleaks_${version}_linux_x64.tar.gz"
        url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"

        curl --fail --silent --show-error --location --retry 3 --output "/tmp/${archive}" "$url"
        echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum --check --strict

        # Extract, which this step never did. It downloaded the tarball, verified the
        # checksum against a **pinned** hash — correctly, so the bytes are known — and then
        # went looking for a binary inside a directory it had never created. Every failure
        # below this line was that: `install: cannot stat '/tmp/gitleaks/gitleaks'`.
        #
        # Three failures stacked on one step, each hiding the one under it, and the step had
        # never been read end to end by anyone:
        #   1. no extraction, so nothing to install;
        #   2. `install --directory /usr/local/bin /tmp/gitleaks` copies the *directory*, so
        #      even with extraction the binary landed at `/usr/local/bin/gitleaks/gitleaks`,
        #      one level below PATH — hence `gitleaks: command not found` once (1) was fixed;
        #   3. and the runner is not root, so `install` needed `sudo` to write
        #      `/usr/local/bin` at all.
        #
        # The `security` job failed on this step alone, which means the working-tree and
        # history secret scans, the licence check, the duplication gate and the complexity
        # gate — every one of them queued behind it — had never run in CI. An unrun
        # security scan is not a pass.
        tar --extract --gzip --file "/tmp/${archive}" --directory /tmp

        # The **binary**, to the directory on PATH. `-m 0755` because the tarball's mode is
        # not something to depend on, and `sudo` for the reason in the note above.
        sudo install -m 0755 "/tmp/gitleaks/gitleaks" /usr/local/bin/gitleaks
        gitleaks version
