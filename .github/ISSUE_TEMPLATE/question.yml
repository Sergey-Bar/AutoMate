name: Question
description: How something works, or how to use it.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Check the [documentation site](https://sergey-bar.github.io/AutoMate/) and
        `SUPPORT.md` first — a question that the docs should have answered is worth asking
        anyway, because it means the docs are missing something.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What you have tried
      description: Pages you read, commands you ran, and what they printed.
