name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

defaults:
  run:
    working-directory: Automate

jobs:
  mutation:
    name: Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Automate/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Run Stryker (incremental)
        run: npx stryker run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: Automate/reports/
          retention-days: 30

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Automate/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.14.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: Automate/.lighthouseci/
          retention-days: 30

  k6-smoke:
    name: k6 Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Automate/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Start API server
        run: pnpm --filter @automate/server dev &
        env:
          OLLAMA_HOST: http://localhost:11434
      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... attempt $i/30"
            sleep 2
          done
          echo "Server did not start in time" && exit 1
      - uses: grafana/setup-k6-action@v1
      - name: Run k6 smoke test
        run: k6 run k6/smoke.js
        env:
          AUTOMATE_URL: http://localhost:3000

  k6-load:
    name: k6 Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Automate/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Start API server
        run: pnpm --filter @automate/server dev &
        env:
          OLLAMA_HOST: http://localhost:11434
      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... attempt $i/30"
            sleep 2
          done
          echo "Server did not start in time" && exit 1
      - uses: grafana/setup-k6-action@v1
      - name: Run k6 load test
        run: k6 run k6/load.js
        env:
          AUTOMATE_URL: http://localhost:3000

  full-e2e:
    name: Full E2E (with Ollama)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Automate/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Pull llama3.1 model
        run: |
          curl -sf http://localhost:11434/api/pull \
            -H 'Content-Type: application/json' \
            -d '{"name":"llama3.1"}' \
            --retry 5 --retry-delay 5 --retry-all-errors
      - name: Run all Playwright tests
        run: npx playwright test
        env:
          CI: 'true'
          OLLAMA_HOST: http://localhost:11434
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: Automate/playwright-report/
          retention-days: 14

  knip:
    name: Dead Code (Knip)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Automate/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Knip (informational)
        run: pnpm knip --reporter json > knip-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: knip-report
          path: Automate/knip-report.json
          retention-days: 30

  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Automate/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Check bundle size
        run: pnpm size --json > size-report.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-size-report
          path: Automate/size-report.json
          retention-days: 30
