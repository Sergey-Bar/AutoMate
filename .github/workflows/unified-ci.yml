name: Unified CI

on:
  push:
    branches:
      - main
      - 'migration/**'
    paths:
      - '**'
  pull_request:
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.x
  PNPM_VERSION: 10.30.2

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Boundary preflight
        run: pnpm unify:preflight
      # `pnpm compose:config` rather than the raw `docker compose … config` line this
      # step used to spell. The script existed and was in no workflow, which meant the
      # compose file was being validated by a command that could be edited without
      # anyone noticing a second copy had drifted.
      - name: Unified Compose config
        # Placeholders rather than secrets. This step only asks docker compose to
        # resolve and print the file — no container starts — and the compose file
        # marks every required variable so a misconfigured local stack fails loudly.
        # Resolving the file therefore needs values, and a real credential is not
        # one of them.
        #
        # The last three are the object store's. They are here because
        # `docker-compose.unified.yml` now declares a `minio` service and wires
        # `OBJECT_STORE_*` into the API, which sets `NODE_ENV: production` — and
        # `apps/api/src/startup-policy.ts` refuses to start a production deployment
        # without them. Without these three values this step would fail on a missing
        # variable rather than on anything wrong with the compose file, which is the
        # worst way for a config gate to be red.
        env:
          POSTGRES_PASSWORD: ci-config-validation-32-characters
          COOKIE_SECRET: ci-config-validation-32-characters
          VAULT_SECRET: ci-config-validation-32-characters
          AUTOMATE_API_KEY: ci-config-validation-32-characters
          REPORTER_SECRET: ci-config-validation-32-characters
          RUNNER_REGISTRATION_SECRET: ci-config-validation-32-characters
          MINIO_ROOT_USER: ci-config-validation-32-characters
          MINIO_ROOT_PASSWORD: ci-config-validation-32-characters
          OBJECT_STORE_BUCKET: ci-config-validation-32-characters
          OBJECT_STORE_REGION: ci-config-validation-32-characters
        run: pnpm compose:config
      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Migration check
        run: pnpm db:check
      - name: Documentation drift
        # A document citing a file that does not exist, or a JSON row declaring a
        # key twice, is a claim the tree does not back. Both were invisible: the
        # first because a reviewer's eye is the only thing that reads prose, the
        # second because `JSON.parse` silently takes the last of a duplicated key.
        run: pnpm docs:check
      - name: Dead exports
        # `packages/runner-sdk/src/client.ts` was a second HTTP client for the
        # runner protocol, imported by nothing, with its own passing test suite.
        # Two clients and two suites for one endpoint pair is how a protocol change
        # lands in one and silently misses the other.
        run: pnpm docs:dead-exports
      - name: License check
        run: pnpm license:check
      - name: Audit
        run: pnpm audit --audit-level=high

  unit-and-coverage:
    name: Unit and coverage
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Workspace build
        run: pnpm build
      # The coverage artifacts the ratchet job reads. Uploaded here because this is
      # the job that produced them; the `provenance.json` beside each summary records
      # the content hash of the inputs that run measured, which is what makes it
      # sound for a *different* job to judge them — see `coverage-ratchet` below.
      - name: Upload coverage summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-summaries
          path: |
            **/coverage/coverage-summary.json
            **/coverage/provenance.json
          if-no-files-found: ignore
          retention-days: 7

  coverage-ratchet:
    name: Coverage ratchet
    needs: unit-and-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Its own required job, because the ratchet is the only gate that can prove a
    # floor was not lowered — and until now it was reachable only from
    # `release-gate.yml`, which is `workflow_dispatch` only. A PR could lower a
    # coverage floor and merge, and the release run would be the first thing to
    # notice.
    #
    # Running it here rather than inside `unit-and-coverage` is sound because of the
    # provenance stamp: each `provenance.json` carries the content hash of the inputs
    # the coverage run measured, and `staleCoverageFinding` rejects any summary whose
    # stamp no longer matches the checked-out source. A summary restored from a cache,
    # or produced against different code, fails the ratchet instead of being believed.
    # The job summary carries a per-package table of floor against measured.
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # History, not a shallow clone. The floor ratchet reads the base commit's
          # `coverage-baseline.json` — a floor may go up, never down, and the only
          # record that survives the pull request is history.
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Download coverage summaries
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: coverage-summaries
          path: .
      - name: Coverage ratchet
        env:
          # The base is named explicitly rather than inferred from `HEAD~1`, so the
          # comparison does not depend on how the checkout was ref'd for this event.
          COVERAGE_FLOOR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm coverage:ratchet

  commit-message:
    name: Commit message
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # `pnpm exec commitlint` rather than a Docker action, so CI enforces the
    # repository's own `commitlint.config.js` — including the `scope-enum`
    # vocabulary that decides which scopes exist — with the same commitlint
    # version the local hook runs. A Docker action ships its own commitlint and
    # its own config resolution, so the two gates were never the same gate.
    #
    # `fetch-depth: 0` because both ends of the range have to be present, and the
    # range is deliberately not the whole history: the push range, or the commits
    # this pull request introduced.
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # `--ignore-scripts`: this job needs the commitlint CLI and nothing that a
      # postinstall builds.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint the push range
        if: github.event_name != 'pull_request'
        run: pnpm exec commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}"
      - name: Lint the pull request's commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"

  migration-report:
    name: Migration report
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Tier `pr-reporting`, per plan D6: the report appears on every PR and blocks
    # nothing. `migrate:plan` and `migrate:validate` existed and were wired into no
    # workflow, no `verify` and no `verify:release`, so the migration gate had never
    # run in CI at all.
    #
    # `migrate:apply` is deliberately absent and must stay absent. CI has no
    # persistent database, so applying a migration there proves nothing about the
    # migration and only produces a throwaway schema.
    #
    # `continue-on-error` is gone, and its absence is the point. It was here because the
    # job's steps were the two legacy commands that could not run, and a tolerated job
    # reporting a tolerated failure is a job that reports nothing. The job now runs
    # `db:check`, which `gate-tooling.json` tiers `pr-blocking`, so tolerating it would
    # mean a required check whose result the workflow is allowed to discard — and the
    # repository's own `gate-tooling.test.mjs` says so: *"a required gate whose result a
    # workflow is allowed to discard reports green whether it ran or not."* It failed that
    # audit the moment the job's contents changed, which is the audit doing its job.
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      # The legacy source-migration steps are gone, and both of them were failing.
      #
      # `migrate:plan` requires `--from --source-id --source-commit --target-commit
      # --out` and `migrate:validate` requires `--plan`; this job called both bare, so each
      # exited 1 with `plan requires …` and `validate requires --plan` and took the job
      # with it. The arguments are not available because there is nothing to migrate
      # *from*: the merge out of the two legacy repositories is complete (ADR-001, the
      # capability register, and the phase-0 decision record all say so) and their history
      # is not in this repository. Inventing a source and a target to satisfy an argument
      # list would produce a plan that looks real and describes nothing.
      #
      # What this repository *can* decide about its schema is the journal: every applied
      # migration in order, and the Drizzle schema in agreement with it. That is what the
      # job now runs, and it is a real check rather than a renamed one — `db:check` reads
      # `packages/db/drizzle/meta/_journal.json` and the schema, and fails if they have
      # parted company.
      - name: Check the migration journal against the schema
        run: pnpm db:check
      - name: Upload the migration report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-report
          path: var/migration-*
          if-no-files-found: ignore
          retention-days: 30

  api-e2e:
    name: API vertical slice
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # `playwright.config.ts` throws without DATABASE_URL, so an E2E job with no
    # PostgreSQL is a configuration error rather than a silently in-memory pass.
    # `E2E_ALLOW_IN_MEMORY` is deliberately not set here: that switch is for a
    # deliberate local run and proves nothing about the durable product.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: automate
          POSTGRES_DB: automate
          # 	rust, not a password. The service port is bound to the runner
          # only, and a password here would be a credential committed to the
          # repository — which pnpm security:secrets refuses, correctly. The
          # database is destroyed with the job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automate -d automate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://automate@127.0.0.1:5432/automate
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: API E2E tests
        run: pnpm test:e2e:api
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-e2e-evidence
          path: test-results/evidence
          if-no-files-found: ignore
          retention-days: 14

  render-budget:
    # The name says what the job is *doing*, not just what it is called, because the
    # answer differs by phase and a reviewer has to tell them apart at a glance. Once
    # a baseline is recorded this reads as a gate and stops changing.
    name: Rendering budget (measuring, no ceiling recorded)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # `contents: read` is inherited from the workflow-level block, and this job needs
    # nothing more: it checks out, installs, and runs Playwright. No job in this file
    # writes to the repository, a release, a package or a comment, so there is no
    # per-job `permissions:` to add — declaring one here would be noise that reads as
    # a grant.
    #
    # The two-phase rollout, and why it is two phases:
    #
    #  - **Measurement phase (now).** `performance/rendering-budget.json` has no
    #    recorded ceiling, so this job measures the four primary routes and publishes
    #    the numbers to the job summary without comparing them. It is **not** a
    #    required check. The obvious alternative — keep it `pr-blocking` and red until
    #    someone measures — is indefensible in practice: a required check that can
    #    never pass blocks every pull request, teaches reviewers to read red as
    #    noise, and buries the failures that matter under a failure nobody can fix
    #    without hardware.
    #  - **Threshold phase (after a real run).** Someone runs `pnpm render:baseline` on
    #    the reference hardware the plan's D10 commits to, reviews the diff, and
    #    commits it. The comparison becomes a real gate, and `test:render` becomes
    #    `pr-blocking` **in the same commit**.
    #
    # That transition is not a convention. `scripts/lib/render-gate-phase.mjs` derives
    # the required tier from the baseline, and `gate-tooling.test.mjs` fails until the
    # manifest agrees — so graduating the gate cannot be forgotten, and a `recorded:
    # true` beside invented numbers with a `pr-reporting` tier is caught rather than
    # becoming a gate that is permanently green and not required.
    #
    # What is *not* relaxed in the measurement phase: the measurement itself must be
    # complete. A metric `PerformanceObserver` never reported is a broken instrument,
    # not a fast route, and the spec fails on that in every phase. Only the ceilings
    # are skipped. The comparison rules themselves are unit-tested inside
    # `pnpm test:integration`, so the policy is checked on every PR even while the
    # measurement is not.
    #
    # Not in `verify`: this needs a browser and a PostgreSQL, and `verify` has a
    # 20-step budget (D6) that the plan spends elsewhere.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: automate
          POSTGRES_DB: automate
          # 	rust, not a password. The service port is bound to the runner
          # only, and a password here would be a credential committed to the
          # repository — which pnpm security:secrets refuses, correctly. The
          # database is destroyed with the job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automate -d automate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://automate@127.0.0.1:5432/automate
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      # The Chromium build is ~170 MB and is the slowest step in this job by a wide
      # margin. Caching it is standard practice and safe here specifically because
      # nothing in this repository consumes caches across workflows: the cache-poisoning
      # path in the Actions threat model runs through `workflow_run`, and no workflow
      # here triggers one. The key includes the Playwright version from the lockfile, so
      # a dependency bump misses the cache instead of installing a stale browser.
      - name: Cache the Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # `--with-deps` still runs every time: it installs apt packages, which is a
      # system-level change a file cache cannot restore, and the browser download above
      # is then a no-op cache hit.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Phase-neutral on purpose: this measures while no ceiling is recorded and
      # compares once one is. The job name above says which phase is in force, and it
      # is the thing that changes — the command does not.
      - name: Rendering budget
        run: pnpm test:render

  contract:
    name: Contract tests
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Contract suite
        run: pnpm test:contract

  security:
    name: Security and license audit
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        # Full history: `pnpm security:secrets` scans every commit, and
        # `gitleaks detect` follows. A shallow clone makes a history scan
        # silently pass over the commits it never received.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install static-analysis scanners
        uses: ./.github/actions/install-scanners
      - name: Secret scan (working tree)
        run: pnpm security:secrets
      # Proportional to the commit count, so it is a CI step and not a pre-commit
      # hook. The tree scan above cannot see a value that was committed and then
      # removed, which is what an ordinary `git rm` or an edit that strips a
      # credential leaves behind.
      - name: Secret scan (git history)
        run: pnpm security:secrets:history
      - name: Security and license verification
        run: pnpm security:verify

  e2e:
    name: Product E2E
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: automate
          POSTGRES_DB: automate
          # 	rust, not a password. The service port is bound to the runner
          # only, and a password here would be a credential committed to the
          # repository — which pnpm security:secrets refuses, correctly. The
          # database is destroyed with the job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automate -d automate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://automate@127.0.0.1:5432/automate
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Full current E2E
        run: pnpm test:e2e
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-e2e-evidence
          path: test-results/evidence
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Local integration gates
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Local integration checks
        run: pnpm test:integration

  vertical-slice:
    name: Universal QA vertical slice
    needs: [quality, unit-and-coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: automate
          POSTGRES_DB: automate
          # 	rust, not a password. The service port is bound to the runner
          # only, and a password here would be a credential committed to the
          # repository — which pnpm security:secrets refuses, correctly. The
          # database is destroyed with the job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automate -d automate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://automate@127.0.0.1:5432/automate
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run vertical slice E2E
        run: pnpm test:e2e:vertical
      - name: Upload vertical-slice evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vertical-slice-evidence
          path: test-results/evidence
          if-no-files-found: ignore
          retention-days: 14

  runner:
    name: Runner protocol
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Runner tests
        run: pnpm test:runner
      - name: Worker tests
        run: pnpm --filter @automate/worker test
