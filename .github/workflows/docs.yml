name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# `contents: read` is the **whole workflow's** default, and the deploy job below
# overrides it with exactly the two scopes Pages needs. Least privilege is the
# reason this is a job-level block rather than a workflow-level one: `id-token:
# write` mints an OIDC token that GitHub exchanges for permission to publish,
# and it has no business being granted to a job that installs dependencies and
# runs `pnpm docs:check`. The build half of this workflow never touches either.
permissions:
  contents: read

# Without this, two pushes to `main` build the site concurrently and the later
# deployment can finish first, publishing a *newer* build and then being replaced by
# an older one. `cancel-in-progress` is false so a build already in flight finishes
# rather than leaving the published site at whatever the previous successful build
# left.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.x
  # The Pages base, derived rather than hardcoded.
  #
  # A GitHub *project* page is served from `/<repo>/`, so every asset URL in the
  # built HTML has to carry that prefix or the site renders unstyled and blank —
  # which is what `site/.vitepress/config.mts` warns about when it defaults to `/`.
  # Deriving it from the repository name rather than writing `/AutoMate/` means a
  # fork under a different owner is still correct, and it means renaming the
  # repository cannot silently leave a stale prefix in a workflow file.
  SITE_BASE: /${{ github.event.repository.name }}/

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        # Full history: `pnpm docs:check` reads the ledger and the register, and the
        # capability register records a baseline commit that must be reachable.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        # No `version:`. `pnpm/action-setup` reads `packageManager` from the root
        # package.json, and pnpm's own `pmOnFail: error` refuses a mismatch. This
        # workflow used to carry `PNPM_VERSION` beside it, which was a second place
        # stating the same version that nothing compared against the first.
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the committed pages are current
        # **Before** generating, and this ordering is the point.
        #
        # The first version ran `pnpm site:generate` first and `pnpm docs:check`
        # second, which made the staleness check satisfied by construction: the
        # generator had just rewritten the very files it was about to compare. The
        # check is now read-only — it generates into `node_modules/.cache` and diffs
        # — so running it here fails if the committed pages have drifted.
        run: |
          pnpm docs:check
          pnpm docs:dead-exports

      - name: Generate the status pages
        # The capabilities, findings, and coverage pages are generated from
        # machine-checked sources, so they cannot claim more than the gates prove.
        # This step only exists so the deployed site matches the sources even if the
        # check above somehow passed; the check above is the gate.
        run: pnpm site:generate

      - name: Build
        run: pnpm --filter @automate/docs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site/dist

  # `SITE-1` in the findings ledger was the row saying this job did not exist. It
  # does now, and the row's removal condition was written before it was written:
  # a workflow that publishes `site/dist` **and** runs `SITE_DOCTOR_BUILT=1 pnpm
  # site:doctor` against the built output.
  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # `pages: write` — publish the uploaded artifact.
      pages: write
      # `id-token: write` — mint the OIDC token GitHub's Pages infrastructure
      # exchanges for permission to deploy. This is the scope the plan named as
      # "a security decision, not a design one", and it is why this is a
      # job-level grant on a job whose only step is one pinned action.
      id-token: write
    environment:
      # Required by Pages, and the thing that makes a deployment a reviewable
      # event: it gives the repository a place to put protection rules and a URL
      # for the deployment history, rather than publishing on trust.
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A separate group from the build's, so a queued deploy is not cancelled by a
    # build that happens to share the workflow's group name.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4, the pair for upload-pages-artifact v3 above
