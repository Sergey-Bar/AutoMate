name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Without this, two pushes to `main` build the site concurrently and the later
# deployment can finish first, publishing a *newer* build and then being replaced by
# an older one. `cancel-in-progress` is false so a build already in flight finishes
# rather than leaving the published site at whatever the previous successful build
# left.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.x
  PNPM_VERSION: 10.30.2

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        # Full history: `pnpm docs:check` reads the ledger and the register, and the
        # capability register records a baseline commit that must be reachable.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the committed pages are current
        # **Before** generating, and this ordering is the point.
        #
        # The first version ran `pnpm site:generate` first and `pnpm docs:check`
        # second, which made the staleness check satisfied by construction: the
        # generator had just rewritten the very files it was about to compare. The
        # check is now read-only — it generates into `node_modules/.cache` and diffs
        # — so running it here fails if the committed pages have drifted.
        run: |
          pnpm docs:check
          pnpm docs:dead-exports

      - name: Generate the status pages
        # The capabilities, findings, and coverage pages are generated from
        # machine-checked sources, so they cannot claim more than the gates prove.
        # This step only exists so the deployed site matches the sources even if the
        # check above somehow passed; the check above is the gate.
        run: pnpm site:generate

      - name: Build
        run: pnpm --filter @automate/docs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site/dist
