name: CodeQL

# Static analysis on every pull request and every push to main, published to the code-scanning
# tab. Semgrep already runs in the `security` job of unified-ci.yml with this repository's own
# rules (`.config/semgrep.yml`); CodeQL adds GitHub's data-flow queries for TypeScript and for
# the workflows themselves, and is what OpenSSF Scorecard's SAST check reads.
#
# No build: `build-mode: none` reads the TypeScript and JavaScript sources directly.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Read the code, write the results to code scanning, and nothing else.
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialise CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyse
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
