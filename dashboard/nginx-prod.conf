# Automate — nginx-prod.conf
# Production nginx configuration with TLS termination, WebSocket proxying,
# security headers, and gzip compression.
#
# Mount at: /etc/nginx/conf.d/default.conf  (via docker-compose.prod.yml)
# Used by:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ─────────────────────────────────────────────────────────────────────────────
# TLS CERTIFICATE SETUP (Let's Encrypt / certbot)
# ─────────────────────────────────────────────────────────────────────────────
#
# 1. Install certbot on the host:
#      apt-get install -y certbot
#
# 2. Obtain a certificate (standalone mode — stop nginx first if running on :80):
#      certbot certonly --standalone -d your-domain.com --agree-tos -m you@example.com
#
#    Or use webroot mode while nginx is running (recommended for renewals):
#      certbot certonly --webroot -w /var/www/certbot -d your-domain.com \
#        --agree-tos -m you@example.com
#
# 3. Certificates are written to /etc/letsencrypt/live/your-domain.com/:
#      fullchain.pem  — certificate + chain
#      privkey.pem    — private key
#
# 4. Replace every occurrence of "your-domain.com" below with your actual domain.
#
# 5. Auto-renewal (runs every 12h, renews 30 days before expiry):
#      Add to crontab:  0 */12 * * * certbot renew --quiet --deploy-hook "docker compose -f /path/to/docker-compose.yml -f /path/to/docker-compose.prod.yml exec nginx nginx -s reload"
#
# 6. For self-signed certificates (internal/staging only):
#      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#        -keyout /etc/letsencrypt/live/your-domain.com/privkey.pem \
#        -out    /etc/letsencrypt/live/your-domain.com/fullchain.pem \
#        -subj "/CN=your-domain.com"
#
# ─────────────────────────────────────────────────────────────────────────────

# ── Upstream: Fastify application (HTTP / SPA / browser WebSocket) ────────────
upstream automate_backend {
    server automate:4000;
    keepalive 32;
}

# ── Upstream: Reporter WebSocket ingestion ────────────────────────────────────
# Playwright reporters connect here to stream test results
upstream automate_reporter {
    server automate:4001;
    keepalive 16;
}

# ── Gzip compression ──────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

# ─────────────────────────────────────────────────────────────────────────────
# Server block 1: HTTP → HTTPS redirect
# All plain HTTP traffic is permanently redirected to HTTPS.
# The /.well-known/acme-challenge/ path is exempt for Let's Encrypt renewal.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name your-domain.com;

    # Let's Encrypt webroot challenge — must be reachable over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Server block 2: HTTPS — main dashboard (port 443)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;

    # ── TLS certificates (Let's Encrypt) ─────────────────────────────────────
    # Replace "your-domain.com" with your actual domain name.
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # ── TLS protocol and cipher hardening ────────────────────────────────────
    # Supports TLS 1.2 and 1.3 only. Drops legacy TLS 1.0/1.1.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;

    # ── TLS session resumption ────────────────────────────────────────────────
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── OCSP stapling ─────────────────────────────────────────────────────────
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security headers ──────────────────────────────────────────────────────
    # Prevents the dashboard from being embedded in an iframe on other origins
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Prevents MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Tells browsers to only use HTTPS for 1 year, including subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Basic XSS protection for older browsers
    add_header X-XSS-Protection "1; mode=block" always;
    # Controls referrer information sent to third-party origins
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Restrict browser features not needed by the dashboard
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # ── Client body size ──────────────────────────────────────────────────────
    # Allow up to 100 MB for artifact uploads
    client_max_body_size 100m;

    # ── WebSocket: browser ↔ Fastify (/ws path on port 4000) ─────────────────
    location /ws {
        proxy_pass http://automate_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep WebSocket alive for long test runs (up to 24 h)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        # Disable proxy buffering for real-time streaming
        proxy_buffering off;
    }

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://automate_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Disable buffering for SSE / streaming endpoints
        proxy_buffering off;
    }

    # ── Artifact files ────────────────────────────────────────────────────────
    # Artifacts (screenshots, videos, traces) are immutable per run — cache aggressively.
    location /artifacts/ {
        proxy_pass http://automate_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_valid 200 1d;
        # Cache artifacts in the nginx_cache volume
        proxy_cache_key "$scheme$request_method$host$request_uri";
    }

    # ── Health endpoints ──────────────────────────────────────────────────────
    location /health/ {
        proxy_pass http://automate_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache off;
        # Allow external health checks without HSTS redirect overhead
        access_log off;
    }

    # ── SPA catch-all ─────────────────────────────────────────────────────────
    # Fastify serves the React SPA (index.html) for all unmatched routes
    location / {
        proxy_pass http://automate_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# Server block 3: Reporter WebSocket ingestion (port 4001)
# Playwright reporters connect directly to this port to stream test results.
# Expose port 4001 on the host (already mapped in docker-compose.prod.yml).
# This block adds TLS to the reporter WebSocket so reporters can connect via wss://
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 4001 ssl;
    http2 off;  # WebSocket upgrades do not work over HTTP/2
    server_name your-domain.com;

    # Reuse the same TLS certificates
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL_reporter:5m;
    ssl_session_timeout 1d;

    # Security headers (keep consistent across all vhosts)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Reporter WebSocket proxy ──────────────────────────────────────────────
    location / {
        proxy_pass http://automate_reporter;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep reporter WebSocket alive for the full duration of a test run
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
