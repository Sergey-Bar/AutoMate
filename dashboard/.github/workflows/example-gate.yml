name: Playwright Tests with Quality Gate

# Example: Run Playwright tests and enforce the Automate quality gate.
#
# Prerequisites:
#   1. Dashboard running and accessible (set DASHBOARD_HOST in env or secrets)
#   2. AUTOMATE_DASHBOARD_API_KEY secret configured in GitHub repo settings
#   3. @automate/reporter installed in your project
#
# Usage:
#   Copy this file to .github/workflows/tests.yml and adjust the
#   DASHBOARD_HOST environment variable and test command to match your project.

on:
  push:
    branches: [main]
  pull_request:

env:
  DASHBOARD_HOST: your-dashboard.example.com   # Change to your Dashboard host

jobs:
  test:
    name: Test + Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Step 1: Run tests and stream results to the Dashboard reporter.
      # The reporter prints the run ID to stdout as: "Automate run: <runId>"
      - name: Run Playwright tests
        id: playwright
        run: |
          npx playwright test 2>&1 | tee playwright-output.txt
          echo "run_id=$(grep -oP '(?<=Automate run: )\S+' playwright-output.txt | head -1)" >> "$GITHUB_OUTPUT"
        env:
          AUTOMATE_DASHBOARD_URL: ws://${{ env.DASHBOARD_HOST }}:4001
          AUTOMATE_DASHBOARD_API_KEY: ${{ secrets.AUTOMATE_DASHBOARD_API_KEY }}
        continue-on-error: true   # Don't fail yet — let the gate decide

      # Step 2: Wait for gate evaluation and check the result.
      - name: Check quality gate
        run: |
          RUN_ID="${{ steps.playwright.outputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            echo "::warning::No run ID captured from reporter output. Skipping gate check."
            exit 0
          fi
          bash scripts/check-gate.sh \
            --url "http://${{ env.DASHBOARD_HOST }}:4000" \
            --run-id "$RUN_ID" \
            --api-key "${{ secrets.AUTOMATE_DASHBOARD_API_KEY }}" \
            --wait \
            --timeout 300
        env:
          AUTOMATE_DASHBOARD_API_KEY: ${{ secrets.AUTOMATE_DASHBOARD_API_KEY }}

      # Optional: upload test artifacts for debugging
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
