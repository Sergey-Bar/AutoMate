# Automate — nginx reverse proxy config
# Mount at: /etc/nginx/conf.d/default.conf
# Used by: docker-compose --profile nginx up -d

upstream automate_backend {
    server automate:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Increase client body size for artifact uploads (if added in future)
    client_max_body_size 100m;

    # ── WebSocket (browser ↔ Fastify WS on /ws) ──────────────────────────────
    location /ws {
        proxy_pass http://automate_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep WS connections alive for long test runs (up to 24h)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://automate_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming response support (for future SSE endpoints)
        proxy_buffering off;
    }

    # ── Artifact file serving ─────────────────────────────────────────────────
    location /artifacts/ {
        proxy_pass http://automate_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Enable caching for artifact files (they are immutable per run)
        proxy_cache_valid 200 1d;
    }

    # ── Health endpoints (for load balancers + uptime monitors) ───────────────
    location /health/ {
        proxy_pass http://automate_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # No caching — must always be live
        proxy_cache off;
    }

    # ── SPA catch-all ─────────────────────────────────────────────────────────
    # Fastify serves the React SPA index.html for all unmatched paths
    # (React Router handles client-side routing)
    location / {
        proxy_pass http://automate_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
