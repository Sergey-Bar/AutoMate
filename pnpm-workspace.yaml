  '@sentry/vite-plugin': ^5.4.0
  '@testing-library/dom': ^10.1.0
  '@testing-library/react': ^16.3.2
  '@types/node': ^22.15.3
  '@types/pg': ^8.15.6
  '@types/react': ^19.2.14
  '@types/react-dom': ^19.2.3
  '@vitest/coverage-v8': ^4.1.5
  drizzle-kit: ^0.31.9
  drizzle-orm: ^0.45.2
  eslint: ^9.21.0
  jsdom: ^24.1.3
  lucide-react: ^0.577.0
