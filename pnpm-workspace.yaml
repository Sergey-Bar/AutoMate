packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/connectors/*'
  - 'tools/*'
  - 'tests/*'

autoInstallPeers: false
strictPeerDependencies: true
resolvePeersFromWorkspaceRoot: true
packageManagerStrictVersion: true
engineStrict: true

onlyBuiltDependencies:
