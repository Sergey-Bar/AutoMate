packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/connectors/*'
  # The documentation site, which is a package at `site/` rather than a group of
  # them. `site/*` would match nothing today and would match a sub-package only if
  # one were ever added, which is not the shape this repository has.
  - 'site'
  - 'tools/*'
  - 'tests/*'

autoInstallPeers: false
strictPeerDependencies: true
resolvePeersFromWorkspaceRoot: true
engineStrict: true

# `packageManagerStrictVersion: true` was removed in pnpm 11 and `pmOnFail` subsumes it,
# together with `packageManagerStrict` and `managePackageManagerVersions`. Same intent as
# before — the declared pnpm must be the pnpm running — so a contributor on a different
# version is told rather than silently installing with it.
#
# **This is why the workflows no longer pass `version:` to `pnpm/action-setup`.** They
# each carried `PNPM_VERSION: 10.30.2` beside a `packageManager` field saying the same
# thing, and nothing checked the two agreed. That is the defect the capability register
# calls a `mock` row: a claim the tree makes twice and verifies never. The workflows now
# let `pnpm/action-setup` read `packageManager`, so there is one authority and it is the
# one pnpm itself enforces.
pmOnFail: error

# pnpm 11 replaced `onlyBuiltDependencies` and its relatives with one map. The three
# entries are the same three, and the reasons are unchanged.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  # Fetches the platform binary the Sentry Vite plugin shells out to for
  # source map upload. Without it the build still succeeds and the upload
  # silently never happens, so an unminified stack trace in production.
  '@sentry/cli': true

# **Four pnpm 11 defaults are now in force, and one of them costs something.**
#
# `blockExoticSubdeps` and `strictDepBuilds` both default to true, so a dependency from
# an unexpected registry is refused and a package with an unapproved build script fails
# rather than being skipped. Both are supply-chain controls, and this repository's gate
# chain is already built around the assumption that they hold.
#
# `verifyDepsBeforeRun` defaults to `install`, so every script checks its dependencies
# first instead of failing later inside a test.
#
# `minimumReleaseAge` defaults to **1440 minutes**, and this is the one with a cost: a
# release published less than a day ago will not resolve. That is the npm ecosystem
# hardening against a wave of malicious same-day publishes, and it is kept deliberately.
# The cost is real and worth stating rather than discovering: **a same-day release cannot
# be adopted.** A bump to a version published in the last 24 hours fails to resolve until
# it ages, and the fix is a day of waiting rather than `--ignore-minimum-release-age`.
# `pnpm audit --fix` adds the patched version to `minimumReleaseAgeExclude` for exactly
# this case, so a security fix is never blocked by it.
#
# None of these four is written out as configuration. They are defaults, and a copied
# default is a second authority that stops tracking the first.

# One unmet peer, ignored on purpose.
#
# `vitepress@1.6.4` bundles `@docsearch/js`, which depends on `@docsearch/react`,
# which declares a peer on `search-insights >= 1 < 3`. This repository configures no
# Docsearch: there is no `docsearch` key anywhere under `site/`, no
# `@docsearch/*` dependency, and `pnpm deps:policy` reports nothing importing one.
# So the peer is genuinely unused here rather than merely unresolved.
#
# **It stayed invisible because CI installs with `--frozen-lockfile`,** which skips
# resolution, and a frozen install does not re-check peers. The gap only surfaced on
# the first plain `pnpm install` — which is what a version bump does. That is the
# shape of the defect this repository keeps recording: a check that only runs in one
# of the two ways the tree is installed.
#
# The alternatives were both worse. `strictPeerDependencies: false` would stop the
# check for every package to silence one. Declaring `search-insights` would add a
# dependency that nothing imports, which `pnpm deps:policy` would then report as
# unused — a gate fixing a gate's finding by creating one.
peerDependencyRules:
  ignoreMissing:
    - search-insights
  # `eslint-plugin-jsx-a11y@6.10.2` is the latest release and its peer range is
  # `eslint@^3 || ^4 || ^5 || ^6 || ^7 || ^8 || ^9` — there is no version of it that
  # declares ESLint 10. The plugin is not a stylistic preference: `axe-core` and
  # `vitest-axe` cover what a browser executes, and a static a11y rule catches the
  # class neither can. So the range is widened here rather than by turning
  # `strictPeerDependencies` off for the whole workspace.
  #
  # **A widened range is a claim, so it is checked.**
  # `scripts/lib/eslint-plugin-compatibility.test.mjs` asserts that the recommended
  # `jsx-a11y/*` rules still fire: it feeds a file with a known violation through the
  # real flat config and asserts the rule reports it, next to a compliant component the
  # rule must not report, and it refuses any nested `eslint.config.js`. A plugin that
  # silently stopped firing under a major bump would make every accessibility finding
  # disappear, and a gate that cannot tell the difference between "clean" and "not
  # running" is the trap this repository keeps recording.
  allowedVersions:
    'eslint-plugin-jsx-a11y>eslint': '^10.0.0'

# Transitive pins.
#
# Every override here states the advisory it exists for and a review date. An
# override with no provenance applies forever and will silently mask the next
# parent bump, so a reviewer cannot tell whether it is still needed — which is
# the state these five were in.
#
# Review procedure: on or after the date, either confirm the advisory is fixed
# upstream and drop the override, or move the date and say why it still applies.
#
# Reviewed 2026-10-20: six overrides past their date (browserslist, two brace-expansion, two
# postcss/nanoid, and the ajv fast-uri pin) were removed after `pnpm audit` came back clean
# without them; `vitepress>vite` was kept because it was not.
overrides:
  # GHSA-fx2h-pf6j-xcff (vite `server.fs.deny` bypass on Windows alternate paths,
  # fixed in 6.4.3) reached through `vitepress`, which pins vite 5. VitePress is a
  # build-time-only dependency of the documentation site, but it runs a dev server
  # on a contributor's machine and its output is deployed - so "build only" is not
  # the same as "never executed".
  #
  # **This forces a version outside the range VitePress declares.** Its
  # `dependencies.vite` is `^5.4.14` - a regular dependency, not a peer with a
  # widened range - so pnpm's override is suppressing the mismatch signal on every
  # subsequent install. It works today and `pnpm build` builds the site, so a
  # future breakage is caught by a gate rather than discovered in production. But
  # the combination is unsupported upstream, and the honest fix is a VitePress that
  # takes a patched vite, not a permanent override. Revisit when 2.x stabilises.
  # Reviewed 2026-10-20: still needed. With the override removed, `pnpm audit` reports three
  # vite advisories (the `server.fs.deny` bypass, path traversal in optimized deps, and a
  # launch-editor NTLMv2 disclosure), so this was tested rather than assumed.
  # Raised to 6.4.4 on 2026-10-20 for GHSA-587h-7wmj-h5pm (launch-editor existence-check
  # bypass on Windows, high), with the catalog entry below.
  'vitepress>vite': ^6.4.4
  # Added by `pnpm audit --fix` on 2026-10-20, one entry per advisory it reported. Drop each when
  # its parent takes the fix.
  #
  # GHSA-jp82-f5mq-hwhp (seroval, critical) reached through @tanstack/router-core. Reviewed 2026-10-20.
  seroval@<=1.6.2: ^1.6.3
  # GHSA-68fv-2mgg-jv7q (source-map-js, high). Reviewed 2026-10-20.
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  # hono, moderate, several advisories fixed by 4.13.7 (the API's @hono/node-server). Reviewed 2026-10-20.
  hono@<4.13.7: ^4.13.7
  # @hono/node-server, moderate, fixed in 1.19.15. Reviewed 2026-10-20.
  '@hono/node-server@<1.19.15': ^1.19.15
  # esbuild, moderate and low, through drizzle-kit and vitest. Reviewed 2026-10-20.
  esbuild@<=0.24.2: ^0.25.0
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  # postcss, moderate, through vite. Reviewed 2026-10-20.
  postcss@<=8.5.22: ^8.5.23
  # uuid, moderate, through storybook. Reviewed 2026-10-20.
  uuid@<11.1.1: ^11.1.1
  # fast-uri, moderate (GHSA-hrr3-gc8f-f4qj), through ajv, which commitlint and shared-contracts
  # use. This range override replaced the `ajv@8.20.0>fast-uri` pin, which was removed once it
  # covered the same path. Reviewed 2026-10-20.
  fast-uri@>=3.0.0 <3.1.8: ^3.1.8

