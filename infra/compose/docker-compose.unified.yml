services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: automate
      POSTGRES_USER: automate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # No published port. The database is reached on the compose network only; the dev
    # stack (`compose.dev.yml`) publishes it for a developer's tools.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U automate -d automate']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/migrate.Dockerfile
    environment:
      DATABASE_URL: postgresql://automate:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/automate
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # The object store the production API is required to use. `apps/api/src/startup-policy.ts`
  # refuses to start a production deployment without `OBJECT_STORE_*`, and this service
  # was the missing half of that: the policy was real, the stack was not wired to it,
  # and `NODE_ENV: production` on the API meant the documented production deployment
  # could not have booted. Artifact bytes are evidence — on one process's filesystem
  # they disappear with it — so this is load-bearing, not an optional extra.
  #
  # SeaweedFS replaced MinIO in ledger MNT-21. MinIO stopped publishing community images in
  # October 2025 and deleted `minio/minio` from Docker Hub in September 2026, so this stack
  # could not be pulled on any machine that did not already hold the image — which
  # `pull_policy: never` had been hiding. SeaweedFS is Apache-2.0, multi-arch, and
  # `weed mini` (the image's default command) creates `S3_BUCKET` on start, so no
  # one-shot bucket job is needed. A real deployment points `OBJECT_STORE_ENDPOINT` at its
  # own S3-compatible store and drops this service; the contract is the five variables.
  objectstore:
    image: chrislusf/seaweedfs:4.48
    environment:
      # The store's own credential, from the operator's environment rather than written
      # here: a literal in a committed compose file is a committed secret.
      AWS_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:?set OBJECT_STORE_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:?set OBJECT_STORE_SECRET_ACCESS_KEY}
      S3_BUCKET: ${OBJECT_STORE_BUCKET:?set OBJECT_STORE_BUCKET}
    volumes:
      - objectstore_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      # nginx sits in front and appends the peer it saw to X-Forwarded-For (MNT-7).
      TRUST_PROXY: 'true'
      PORT: '3000'
      DATABASE_URL: postgresql://automate:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/automate
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
      VAULT_SECRET: ${VAULT_SECRET:?set VAULT_SECRET}
      AUTOMATE_API_KEY: ${AUTOMATE_API_KEY:?set AUTOMATE_API_KEY}
      REPORTER_SECRET: ${REPORTER_SECRET:?set REPORTER_SECRET}
      RUNNER_REGISTRATION_SECRET: ${RUNNER_REGISTRATION_SECRET:?set RUNNER_REGISTRATION_SECRET}
      # Required for a database-backed production boot (`NO_INSTALLATION_KEY`), and the
      # credential the installation is signed in with (ledger MNT-19, MNT-20).
      AUTOMATE_INSTALLATION_KEY: ${AUTOMATE_INSTALLATION_KEY:?set AUTOMATE_INSTALLATION_KEY}
      ARTIFACT_ROOT: /var/lib/automate/artifacts
      # The five variables `startup-policy.ts` requires in production. `ARTIFACT_ROOT`
      # stays set for the local-filesystem fallback that development uses; in
      # production the object store is what holds artifact bytes.
      OBJECT_STORE_ENDPOINT: http://objectstore:8333
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:?set OBJECT_STORE_BUCKET}
      OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:?set OBJECT_STORE_REGION}
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID:?set OBJECT_STORE_ACCESS_KEY_ID}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY:?set OBJECT_STORE_SECRET_ACCESS_KEY}
      OBJECT_STORE_FORCE_PATH_STYLE: 'true'
      # `http://objectstore:8333` is plain HTTP, and the policy refuses that in production
      # unless this is set. It is set deliberately and narrowly: the traffic never
      # leaves the compose network, and the alternative — claiming https to a local
      # store — would be a false claim. A deployment with a real S3 endpoint over TLS
      # omits this line and the policy enforces the stricter path.
      OBJECT_STORE_ALLOW_INSECURE: 'true'
      # The URL a user opens: the edge proxy below, the stack's one published port.
      PUBLIC_APP_URL: ${AUTOMATE_PUBLIC_URL:-http://localhost:${AUTOMATE_PORT:-8080}}
      # What the startup policy reads to decide whether this install is reachable from other
      # machines: the edge's published bind, not this container's own 0.0.0.0. A reachable
      # install with no login refuses to start; AUTOMATE_LAN_MODE=1 turns sign-in on.
      AUTOMATE_BIND: ${AUTOMATE_BIND:-127.0.0.1}
      AUTOMATE_LAN_MODE: ${AUTOMATE_LAN_MODE:-0}
      ALLOWED_CLIENT_CIDRS: ${ALLOWED_CLIENT_CIDRS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      objectstore:
        condition: service_healthy
    volumes:
      - artifact_data:/var/lib/automate/artifacts
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      DATABASE_URL: postgresql://automate:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/automate
      ARTIFACT_ROOT: /var/lib/automate/artifacts
      WORKER_INSTANCE_ID: 00000000-0000-4000-8000-000000000001
      WORKER_CAPABILITIES: playwright
      WORKER_LABELS: reference
      WORKER_SLOTS: '1'
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: '3001'
      WORKER_POLL_INTERVAL_MS: '1000'
      WORKER_LEASE_DURATION_MS: '30000'
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - artifact_data:/var/lib/automate/artifacts
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  runner:
    build:
      context: ../..
      dockerfile: infra/docker/runner.Dockerfile
    environment:
      NODE_ENV: production
      AUTOMATE_API_URL: http://api:3000
      RUNNER_INSTANCE_ID: ${RUNNER_INSTANCE_ID:-00000000-0000-4000-8000-000000000002}
      RUNNER_REGISTRATION_SECRET: ${RUNNER_REGISTRATION_SECRET:?set RUNNER_REGISTRATION_SECRET}
      RUNNER_SLOTS: '1'
      RUNNER_ALLOWED_TARGET_URLS: 'http://api,http://web'
      ARTIFACT_ROOT: /var/lib/automate/artifacts
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - artifact_data:/var/lib/automate/artifacts
    networks:
      - default
      - runner_egress
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    # No VITE_API_URL. Vite inlines `VITE_*` at build time, so a runtime value
    # here could never reach the bundle, and `apps/web/src/lib/api.ts` uses
    # relative `/api/v1/…` paths regardless. The API is reached through the
    # nginx `location /api/` proxy in this image — same origin, so no CORS and no
    # second base URL to keep in sync.
    depends_on:
      api:
        condition: service_healthy
    # Unprivileged: the image runs as `nginx` on 8080, so it needs no
    # capabilities, no new privileges, and a read-only filesystem. The only
    # writable path nginx still needs is its cache and pid directory, which the
    # Dockerfile points at /tmp via a tmpfs.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # The front door, and the only published ports: HTTP, and HTTPS once a LAN certificate
  # exists. `/api/` goes to the API and `/` to the web UI, so a user opens one URL. Bound to
  # loopback by default. `AUTOMATE_BIND=0.0.0.0` makes it reachable from other machines, and
  # both the start scripts and the API's startup policy refuse that unless
  # `AUTOMATE_LAN_MODE=1` turns sign-in on.
  edge:
    build:
      context: ../..
      dockerfile: infra/docker/edge.Dockerfile
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - '${AUTOMATE_BIND:-127.0.0.1}:${AUTOMATE_PORT:-8080}:8080'
      - '${AUTOMATE_BIND:-127.0.0.1}:${AUTOMATE_HTTPS_PORT:-8443}:8443'
    environment:
      # The port a browser uses for HTTPS, so the plain-HTTP redirect names the right one.
      AUTOMATE_HTTPS_PORT: ${AUTOMATE_HTTPS_PORT:-8443}
    # The LAN certificate, issued by `start lan-cert`. Empty until then, and the edge serves
    # plain HTTP only (infra/nginx/40-automate-tls.sh).
    volumes:
      - ${AUTOMATE_CERT_DIR:-./certs}:/etc/automate/certs
    healthcheck:
      # `/edge-health` rather than `/`: with TLS on, every other plain-HTTP path redirects.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/edge-health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  signal:
    # Optional: `docker compose --profile signal up -d`. The bridge scheduled reports use to
    # reach Signal, which has no official API. Link it to an account once (see
    # site/guide/notifications.md), then add a Signal channel with the bridge URL
    # `http://signal:8080`. Not published: only the API reaches it, inside this network.
    profiles: ['signal']
    image: bbernhard/signal-cli-rest-api:0.101
    environment:
      MODE: native
    volumes:
      - signal_data:/home/.local/share/signal-cli
    restart: unless-stopped

networks:
  runner_egress:
    driver: bridge

volumes:
  postgres_data:
  artifact_data:
  # Named volume, not a container filesystem: the object store holds artifact bytes
  # that are evidence, so losing them with the container is the failure mode the
  # production policy exists to prevent.
  objectstore_data:
  # The Signal bridge's linked account. Optional, with the `signal` profile.
  signal_data:
