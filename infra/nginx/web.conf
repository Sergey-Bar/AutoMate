server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # This configuration served the dashboard and the API with no security headers
  # at all: no X-Content-Type-Options, no framing policy, no Referrer-Policy,
  # and `server_tokens on`, which advertises the exact nginx version.
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # Matches the API's own execution body cap so an upload the API would accept
  # is not rejected here first.
  client_max_body_size 96m;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
