upstream automate_api { server api:3000; }
# Temp files on the /tmp tmpfs. The container runs read-only as `nginx`, and the tmpfs over
# /var/cache/nginx is root-owned, so the compiled-in paths there failed `mkdir` and the
# container exited on start (ledger MNT-23).
client_body_temp_path /tmp/client_temp;
proxy_temp_path /tmp/proxy_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;

# web listens on 8080 (infra/nginx/web.conf); this said 80, so `/` was a 502 (ledger MNT-22).
upstream automate_web { server web:8080; }

# The dashboard is a same-origin SPA proxying to the API, so it is exposed to
# whatever a browser can be made to send. These headers were all absent.
server {
  listen 8080;
  server_name _;

  server_tokens off;

  # The container healthcheck. Answered here, before the HTTPS redirect below, so a stack
  # with TLS on is still healthy over the plain port it probes.
  location = /edge-health {
    return 204;
  }

  # Written by /docker-entrypoint.d/40-automate-tls.sh when a LAN certificate is mounted:
  # every other plain-HTTP request is redirected to HTTPS. Absent, this matches no file.
  include /tmp/automate/http-redirect*.conf;

  # No fingerprinting the exact nginx version in error pages and headers.
  add_header X-Content-Type-Options "nosniff" always;
  # `frame-ancestors` rather than X-Frame-Options: it also covers the case where
  # this document is framed from a different origin.
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # Matches the API's own execution body cap, so the proxy does not reject an
  # upload the API would have accepted. The API remains the enforcing layer.
  client_max_body_size 96m;

  location /api/ {
    proxy_pass http://automate_api;
    proxy_http_version 1.1;
    # `Host` was forwarded on /api/ but missing on / below, which broke
    # absolute-URL generation for anything the SPA builds from the request.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
    proxy_cache off;
    # The reporter stream and SSE replay endpoints are long-lived.
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://automate_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
  }
}

# The HTTPS server on 8443, written beside the redirect when a certificate is mounted. It
# proxies exactly as the server above; see 40-automate-tls.sh.
include /tmp/automate/tls-server*.conf;
