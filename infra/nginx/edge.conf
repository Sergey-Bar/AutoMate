upstream automate_api { server api:3000; }
upstream automate_web { server web:80; }

# The dashboard is a same-origin SPA proxying to the API, so it is exposed to
# whatever a browser can be made to send. These headers were all absent.
server {
  listen 8080;
  server_name _;

  server_tokens off;

  # No fingerprinting the exact nginx version in error pages and headers.
  add_header X-Content-Type-Options "nosniff" always;
  # `frame-ancestors` rather than X-Frame-Options: it also covers the case where
  # this document is framed from a different origin.
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # Matches the API's own execution body cap, so the proxy does not reject an
  # upload the API would have accepted. The API remains the enforcing layer.
  client_max_body_size 96m;

  location /api/ {
    proxy_pass http://automate_api;
    proxy_http_version 1.1;
    # `Host` was forwarded on /api/ but missing on / below, which broke
    # absolute-URL generation for anything the SPA builds from the request.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
    proxy_cache off;
    # The reporter stream and SSE replay endpoints are long-lived.
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://automate_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
  }
}
