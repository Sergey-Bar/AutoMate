# Semgrep rules for this repository.
#
# Scope. Until this was extended, `scripts/static-analysis.mjs` ran semgrep over
# `apps/api/src` only — so the three applications most likely to be exploited from
# a browser or a subprocess (web, runner, worker) and all of `packages/`,
# `tools/`, `scripts/` and `e2e/` were unexamined by the security gate. A gate
# whose scope is one directory out of nine reports a number that says almost
# nothing, and reads as a passing result.
#
# Each path is listed explicitly rather than as a bare `apps/`, so that adding a
# workspace package is a deliberate decision this file has to record. `test`
# mode excludes are limited to `*.test.*`/`*.spec.*`: a real finding inside a
# test is still a finding, and the previous blanket `--test` exclusions here
# hid the fact that fixtures in this repository are assembled at runtime.
#
# Rules below are the ones this codebase can actually violate. Where a rule
# covers a surface that is currently clean, that is stated in the rule's message
# rather than implied — an unexercised rule is a guardrail, not a finding, and
# the two should not be confused.
#
# Requires semgrep >= 1.45 for `metavariable-comparison` with `<`, `>` and for
# `focus-metavariable` on a call expression.
rules:
  # ---------------------------------------------------------------------------
  # Data layer
  # ---------------------------------------------------------------------------
  - id: no-raw-sql-interpolation
    message: >-
      Raw SQL with an interpolated value. `sql` fragments carry the value into
      the statement text, so a user-controlled value becomes SQL. Use a
      parameterised query — Drizzle's `eq`/`inArray`/`and` — or a bound `$1`
      placeholder.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: security
      cwe: 'CWE-89: SQL Injection'
      confidence: MEDIUM
      technology: [sql]
    patterns:
      - pattern-either:
          # sql`... ${...} ...`
          - pattern: sql`... ${$EXPR} ...`
          - pattern: sql.raw(`... ${$EXPR} ...`)
          - pattern: sql.raw($STR, ...)
          # db.execute(`... ${...} ...`)
          - pattern: $DB.execute(`... ${$EXPR} ...`)
          - pattern: $DB.exec(`... ${$EXPR} ...`)
          - pattern: $DB.query(`... ${$EXPR} ...`)

  - id: no-string-concat-into-query
    message: >-
      A query string built by concatenation or a template literal. Both put the
      value in the statement text, so the same injection risk as an interpolated
      `sql` fragment, reached the other way.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: security
      cwe: 'CWE-89: SQL Injection'
      confidence: LOW
    patterns:
      - pattern-either:
          - pattern: $DB.query(`... ${$EXPR} ...`)
          - pattern: $DB.raw(`... ${$EXPR} ...`)
          - pattern: $DB.prepare($LEFT + $RIGHT)
          - pattern: $DB.prepare(`${$A}${...}$B`)

  - id: no-unbounded-list-in-query
    message: >-
      A caller-supplied list interpolated into `inArray`. A list of arbitrary
      length turns one indexable lookup into a statement the planner cannot
      choose a plan for, and a request that supplies ten thousand ids is enough.
      Cap the list and page, or reject the request.
    severity: WARNING
    languages: [typescript, javascript]
    metadata:
      category: performance
      cwe: 'CWE-400: Uncontrolled Resource Consumption'
      confidence: LOW
    patterns:
      # **A list the caller controls**: a variable, a spread, or a mapped array.
      #
      # The first version matched every `inArray` and reported 9 findings, three of them
      # `inArray(executionJobs.state, ['queued', 'leased', 'requeued'])` — three fixed
      # strings that cannot grow with a request.
      #
      # The obvious exclusion, `pattern-not: inArray(..., $COL, [...], ...)`, **cannot
      # work**: in a semgrep pattern `[...]` means "a list of any length", so it matches a
      # spread and a literal alike, and the rule went silent on the hazard it exists for.
      # `[x, ...]` does not help either — it is "at least one element", which is the same
      # set. So the discriminator is the first character of the argument: an identifier
      # starts with a letter or `$`, and a literal starts with `[`.
      - pattern-either:
          - pattern: inArray(..., $COL, [...$LIST], ...)
          - pattern: 'inArray(..., $COL, $LIST, ...)'
      - metavariable-regex:
          metavariable: $LIST
          regex: '^[A-Za-z_$]'
      # A **subquery**, not a list. `inArray(artifacts.runId, scopedRuns)` where
      # `scopedRuns` is a Drizzle query builder is a subquery: PostgreSQL plans it, and its
      # size is the table's, not a request's. A member access cannot be an attacker-supplied
      # array — the hazard is a spread or an identifier whose length the caller controls,
      # and those are what the two branches above match.
      #
      # **The exclusion names its own metavariables.** Written with the same `$LIST` as
      # the positive pattern, it could never match: semgrep requires a `pattern-not` to be
      # consistent with the bindings the positive pattern already made, so
      # `$LIST.$FIELD` asked for `$LIST` to be `db_` and `$LIST` was bound to `db_.scoped`.
      # A sixth mechanism in this file that reads as an exclusion and is not one — and
      # this one made the rule report the safe shape it was written to stop reporting.
      - pattern-not: 'inArray(..., $EXCLUDED_COL, $EXCLUDED_LIST.$EXCLUDED_FIELD, ...)'

  # ---------------------------------------------------------------------------
  # HTTP surface
  # ---------------------------------------------------------------------------
  - id: express-error-handler-swallowed
    message: >-
      An error callback that takes four parameters but neither rethrows nor
      responds. A caller receives a hung request rather than a refusal, and a
      rejection is silently discarded.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: correctness
      cwe: 'CWE-703: Improper Check or Handling of Exceptional Conditions'
      confidence: MEDIUM
    patterns:
      - pattern: |
          $APP.$METHOD($PATH, (..., $ERR, $REQ, $RES, $NEXT) => { ... })
      - pattern-not: |
          $APP.$METHOD($PATH, (..., $ERR, $REQ, $RES, $NEXT) => { throw $ERR; })
      - pattern-not: |
          $APP.$METHOD($PATH, (..., $ERR, $REQ, $RES, $NEXT) => { ... $RES.status(...); ... })

  - id: no-server-timing-side-channel
    message: >-
      A comparison of secrets without a constant-time primitive. A byte-by-byte
      `===` returns at the first difference, so its timing leaks how much of the
      value was right. Use `crypto.timingSafeEqual`, and pad the lengths first —
      it throws on a mismatch rather than comparing.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: security
      cwe: 'CWE-208: Observable Timing Discrepancy'
      confidence: MEDIUM
    # **Product code only.** The one finding this rule has is in
    # `s3-artifact-bytes.test.ts`, a test-local SigV4 validator that builds its own
    # request and compares the signature it computed against the one it presented. A byte
    # comparison there is not an attack surface: there is no attacker and no secret, and
    # the comparison is the assertion. A rule that reports a test's own scaffolding is a
    # rule a reviewer learns to skip.
    paths:
      exclude:
        - '**/*.test.ts'
        - '**/*.test.tsx'
        - '**/*.spec.ts'
        - '**/*.spec.tsx'
    patterns:
      # The comparison, with the member access **in the positive pattern**.
      #
      # This was the **first execution of the whole semgrep gate in the repository's CI
      # history**: the scanner-install step had failed on every previous run, so
      # `security:static` never ran, and neither did the licence, duplication and
      # complexity gates queued behind it. Its first execution reported **1137 blocking
      # findings across 637 files**, all but a handful from this one rule — because
      # `$OBJ.$SECRET_FIELD` matched *any* property access and only `$OBJ.status` was
      # excluded. `user.id === other.id`, `a.name === b.name`, `event.type === other.type`:
      # every property comparison in the tree.
      #
      # So the constraint is on the **name**, which is what `$SECRET_FIELD` claims to be.
      #
      # **It is bound here rather than validated afterwards, and that is not a style
      # choice.** The previous shape matched `$SECRET === $OTHER` and then checked with a
      # nested `metavariable-pattern` that `$SECRET` was a property access with a
      # credential-shaped name. That is the one rule in this file **semgrep could not
      # compile**: `semgrep scan` failed with `Invalid_argument: String.sub / Bytes.sub`,
      # an OCaml exception raised while semgrep formatted its own error, so the message
      # named line 1 of the *target file* and said nothing about the rule. Two files in
      # the tree hit it, which is the whole reason SEM-2 had no complete per-rule number.
      #
      # Eliminated before concluding that: the parser (identical bytes scan cleanly under
      # `rules: []`), the extension (identical bytes under four names), the size (9 KB of
      # synthetic code is fine), and `language: generic`. Binding `$SECRET_FIELD` in the
      # pattern makes it available to a plain `metavariable-regex`, so there is no nested
      # construct left for the analyser to fail on.
      #
      # `scripts/lib/semgrep-rules.test.mjs` is what proves the behaviour survived, because
      # "no longer errors" and "no longer matches" look identical in a scan report.
      #
      # The repository already does the right thing where it matters — `safeEqual` in
      # `apps/api/src/routes/execution/shared.ts`, used by `registrationAuthorized` and
      # the runner-token check — so a rule firing 1137 times was not reporting the code's
      # security posture. It was reporting that a rule existed.
      - pattern-either:
          - pattern: $OBJ.$SECRET_FIELD === $OTHER
          - pattern: $OBJ.$SECRET_FIELD == $OTHER
          - pattern: $OBJ[$SECRET_FIELD] === $OTHER
          - pattern: $OBJ[$SECRET_FIELD] == $OTHER
      - metavariable-regex:
          metavariable: $SECRET_FIELD
          regex: '(?i)^(secret|password|passwd|passphrase|token|hash|signature|signed|apikey|api_key|secret_key|key_hash|nonce|hmac|digest|credential|cookie|mac)$'
      # Names that are not credentials however secret they sound. No bare `key`: it is
      # too generic to mean "credential" — `e.key`, `event.key` and `route.key` are a
      # keyboard key and a route key, and every one of them was reported. `apikey`,
      # `api_key`, `secret_key` and `key_hash` are the names that do mean one, and they
      # are on the list above.
      - pattern-not: $OBJ.status
      - pattern-not: $OBJ.code
      - pattern-not: $OBJ.type
      - pattern-not: $OBJ.method
      - pattern-not: $OBJ.name
      - pattern-not: $OBJ.id
      # A comparison against a **string literal** is not an oracle, and the exclusion
      # has to sit at the **rule level**, beside the `pattern-either` that matches the
      # comparison.
      #
      # It was written inside the `metavariable-pattern`, where it constrains `$SECRET`
      # *alone* — so `$SECRET === '"$LITERAL"'` could never match a bound `$SECRET`, which
      # is a property access and nothing more. The exclusion was written, and had nothing
      # to exclude, which is the same defect as `no-cleartext-transport-in-client`'s and
      # the fifth instance of it in this file. `route.key === '/login'` compares a value
      # against a constant the attacker cannot measure, so there is nothing to leak.
      - pattern-not: |
          $OBJ.$SECRET_FIELD === "$LITERAL"
      - pattern-not: |
          $OBJ.$SECRET_FIELD === '$LITERAL'

  # ---------------------------------------------------------------------------
  # Subprocesses
  # ---------------------------------------------------------------------------
  - id: no-shell-true
    message: >-
      A subprocess launched from a **string** command, or with `shell: true`. A
      string is interpreted by a shell, so any interpolated value is command
      injection. The argument-array form is the shape to match instead, and
      `apps/runner/src/execution.ts` already uses it and passes `shell: false`
      explicitly.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: security
      cwe: 'CWE-78: OS Command Injection'
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: 'spawn(..., { ..., shell: true, ... })'
          - pattern: 'spawnSync(..., { ..., shell: true, ... })'
          - pattern: 'exec(..., { ..., shell: true, ... })'
          - pattern: 'execSync(..., { ..., shell: true, ... })'
          # And a command that is a **string**.
          #
          # The first version had bare `exec($CMD, ...)`, `execSync($CMD, ...)` and
          # `spawnSync($CMD, ...)`, which match every subprocess call in the repository —
          # including every correct argument-array form. 21 findings, all of them
          # `spawnSync(command, args, {...})` in `scripts/`. The hazard is the *string*, so
          # the string is what is matched.
          #
          # All eight alternatives are in **one** `pattern-either`. The first version of
          # this fix put them in two, and semgrep ANDs two `pattern-either` keys in one
          # `patterns` list — so it required a string command that *also* passed
          # `shell: true`, which is the conjunction of two safe shapes, and the rule went
          # silent on everything including the unsafe one.
          - pattern: 'exec($CMD, ...)'
          - pattern: 'execSync($CMD, ...)'
          - pattern: 'spawn($CMD, ...)'
          - pattern: 'spawnSync($CMD, ...)'
      # **A command *line*, not an executable name.**
      #
      # `spawnSync('git', ['rev-parse', 'HEAD'])` is the argument-array form and is safe:
      # the first argument is the executable and nothing is interpreted. `spawnSync('git
      # rev-parse HEAD')` is a command line, and the shell splits it. A string containing
      # whitespace — or an interpolation, which is never whitespace-free by accident — is
      # the discriminator.
      #
      # Requiring "a string literal" was not enough and fired on both: the argument-array
      # form's first argument is a string too. That is the second version of this rule to
      # report the shape rather than the hazard.
      #
      # **The regex matches the argument's own text and nothing else**, so it must not
      # anchor on a delimiter. Anchoring on `^['"`]...\s...['"`]$` matched the quoted
      # forms and silently missed **every template literal**, which is where the
      # injection actually lives: `` execSync(`git checkout ${branch}`) `` — the one
      # input a real caller writes — produced no finding, while `execSync('git
      # rev-parse HEAD')` produced one. A discriminator that misses the dangerous case
      # and catches the harmless one is worse than no rule, because the finding it does
      # report is evidence the rule works.
      #
      # Whitespace alone is the property that distinguishes the two: an argument-array
      # form's first argument is one token (`git`), and a command line is never. This
      # matches the quoted and the templated form alike, which
      # `scripts/lib/semgrep-rules.test.mjs` asserts against a fixture per case.
      - metavariable-regex:
          metavariable: $CMD
          regex: '.*\s.*'

  - id: no-curl-pipe-shell
    message: >-
      Piping a download straight into a shell. The bytes executed are the bytes
      the server returned, with no checksum and no pinned version. Download to a
      file, verify it, then run it — which is what
      `.github/actions/install-scanners` does for gitleaks.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: security
      cwe: 'CWE-494: Download of Code Without Integrity Check'
      confidence: HIGH
    patterns:
      - pattern-regex: 'curl[^\n]*\|\s*(sudo\s+)?(ba)?sh'

  - id: no-unpinned-remote-chart
    message: >-
      A Helm chart or remote reference without a pinned version. The reference
      resolves to whatever the remote publishes at install time, so the artifact
      is not the one that was reviewed.
    severity: WARNING
    languages: [bash, yaml]
    metadata:
      category: security
      cwe: 'CWE-1104: Use of Unmaintained Third Party Components'
      confidence: LOW
    patterns:
      - pattern-regex: 'helm\s+(install|upgrade)\s+[^\s]+\s+[^\s]*/(?!$)|helm\s+(install|upgrade)\s+[^\s]+\s+[^\s]+(\s|$)(?!.*--version)'

  # ---------------------------------------------------------------------------
  # Browser (apps/web)
  #
  # None of these fire on the current source: the client has no
  # `dangerouslySetInnerHTML`, no `eval`, no `window.open`, and keeps no
  # credential in `localStorage` (sessions are httpOnly cookies, reached with
  # `credentials: 'include'`). They are stated as guardrails because the same
  # files will be edited next month, and a rule that is only added when the
  # finding exists is not a gate.
  # ---------------------------------------------------------------------------
  - id: no-dangerously-set-inner-html
    message: >-
      `dangerouslySetInnerHTML` renders unescaped markup. If the HTML contains
      anything derived from a request, a run name, or a test title, it is XSS in
      this origin, which holds the session cookie. Render text as text.
    severity: ERROR
    # `typescript`, not `tsx`: semgrep has no `tsx` language, and naming one makes
    # the *whole ruleset* fail to load — a gate that reports nothing while looking
    # like it ran. Semgrep's TypeScript parser already handles JSX.
    languages: [typescript]
    metadata:
      category: security
      cwe: 'CWE-79: Cross-site Scripting'
      confidence: HIGH
    patterns:
      - pattern: <$TAG dangerouslySetInnerHTML={{ ... }} ... />

  - id: no-inner-html-sink
    message: >-
      Assigning to `innerHTML`/`outerHTML` or calling `insertAdjacentHTML` writes
      unparsed markup. Anything interpolated into it is executed in this origin.
      Use `textContent`, or build nodes.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: security
      cwe: 'CWE-79: Cross-site Scripting'
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $X
          - pattern: $EL.outerHTML = $X
          - pattern: $EL.insertAdjacentHTML(..., $X)
  - id: no-eval-in-client
    message: >-
      `eval` or `new Function` in browser code executes its argument as code. A
      configuration value or a URL fragment reaching either becomes script
      execution in this origin.
    severity: ERROR
    languages: [typescript, javascript]
    # **Browser code only.** The rule was unscoped, so it also ran over
    # `apps/api/src/infrastructure/artifact-store.ts` and
    # `apps/api/src/middleware/request-deadline.ts`, where `new Function` and
    # `setTimeout` are exactly what a server does. 27 of its 30 findings were
    # `setTimeout(handler, ms)`.
    paths:
      include:
        - apps/web/src/**
        - packages/ui/src/**
        - apps/runner/src/**
        - apps/worker/src/**
      exclude:
        - '**/*.test.ts'
        - '**/*.test.tsx'
    patterns:
      # One alternative, not two: semgrep ANDs two `pattern-either` keys in a single
      # `patterns` list, so the first version of this fix required a call to be *both*
      # `eval`/`new Function` *and* string-argumented — the conjunction of two safe
      # shapes — and the rule went silent on everything including the unsafe one. That
      # is the third rule here where two `pattern-either` keys silently became an AND.
      #
      # `eval` and `new Function` are the hazard whatever their argument is:
      # `eval(fn)` executes a function value as readily as `eval(str)`.
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)

  # `setTimeout` is a separate rule for a separate reason: `setTimeout(handler, ms)` is a
  # timer and `setTimeout('code', ms)` is an `eval`. One rule cannot say "this call, or
  # that call *only when its argument is a string*" without either the conjunction above
  # or matching every timer in the repository, which is what the first version did —
  # 27 of its 30 findings were `setTimeout(handler, ms)`.
  - id: no-string-set-timeout
    message: >-
      `setTimeout` with a string. The browser evaluates a string argument as code, so
      anything reaching it from a URL fragment or a stored value becomes script
      execution in this origin. Pass a function.
    severity: ERROR
    languages: [typescript, javascript]
    paths:
      include:
        - apps/web/src/**
        - packages/ui/src/**
        - apps/runner/src/**
        - apps/worker/src/**
      exclude:
        - '**/*.test.ts'
        - '**/*.test.tsx'
    patterns:
      - pattern-either:
          - pattern: setTimeout($ARG, ...)
          - pattern: setInterval($ARG, ...)
      - metavariable-regex:
          metavariable: $ARG
          regex: '^[\x27"`].*[\x27"`]$'

  - id: no-credential-in-web-storage
    message: >-
      A credential written to `localStorage` or `sessionStorage`. Both are
      readable by any script in the origin, so one XSS anywhere exfiltrates the
      session. The session cookie is `httpOnly` for this reason; keep it that
      way. (A theme or layout preference in the same stores is fine, and is what
      `ThemeProvider` and `Sidebar` do.)
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: security
      cwe: 'CWE-922: Insecure Storage of Sensitive Information'
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: localStorage.setItem($KEY, $VALUE)
          - pattern: sessionStorage.setItem($KEY, $VALUE)
      - metavariable-pattern:
          metavariable: $KEY
          # `language` here is a single string, not the list the rule-level
          # `languages:` key takes. A list is rejected by the schema, and the
          # whole ruleset then fails to load — which is a gate that reports
          # nothing while looking like it ran.
          language: generic
          pattern-regex: '(?i).*(token|secret|password|credential|apikey|api_key|session|auth).*'

  - id: no-unvalidated-navigation
    message: >-
      Navigating to a value. If it can be influenced by request state — a
      `next=` parameter, a stored return URL — it is an open redirect, and a
      `javascript:` value is script execution.
    severity: WARNING
    languages: [typescript, javascript]
    metadata:
      category: security
      cwe: 'CWE-601: Open Redirect'
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: window.open($URL, ...)
          - pattern: location.href = $URL
          - pattern: location.assign($URL)
          - pattern: location.replace($URL)
      - metavariable-pattern:
          metavariable: $URL
          patterns:
            - pattern-either:
                - pattern: $OBJ.$FIELD
                - pattern: $OBJ[$FIELD]
            - pattern-not: $OBJ.pathname
            - pattern-not: $OBJ.href

  - id: no-cleartext-transport-in-client
    message: >-
      A cleartext `http://` URL in browser code. The session cookie is
      `SameSite`-guarded but not transport-guarded, so any cleartext request from
      this origin can be rewritten in flight.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: security
      cwe: 'CWE-319: Cleartext Transmission of Sensitive Information'
      confidence: MEDIUM
    patterns:
      # The whole URL is matched, **not** just `http://`.
      #
      # `pattern-not-regex` in semgrep is tested against the matched text, so a pattern
      # that stopped at `http://` could never exclude anything — the loopback exemption was
      # written and then had nothing to match. The first version's three findings were
      # `fetch(\`http://localhost:…\`)` in `apps/worker/src/config.test.ts`, and the
      # exclusion aimed at exactly those did nothing. Capture the URL, then the exclusion
      # can see the host.
      - pattern-regex: '(fetch|axios\.(get|post|put|patch|delete))\(\s*[\x27"`]http://[^\x27"`]*[\x27"`]'
      # **Loopback is not a transport.** `http://localhost:3000` never leaves the machine,
      # so there is no path for a proxy to read or rewrite.
      - pattern-not-regex: 'http://(localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0)(:\d+)?'

  # ---------------------------------------------------------------------------
  # Transport
  # ---------------------------------------------------------------------------
  - id: no-tls-verification-disabled
    message: >-
      TLS verification turned off. Every certificate is then accepted, so a proxy
      on the path reads and rewrites the traffic — which is the threat model
      certificate pinning exists to stop. For a self-signed *test* endpoint,
      inject a cert fixture instead.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: security
      cwe: 'CWE-295: Improper Certificate Validation'
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: '$OPTS.rejectUnauthorized = false'
          - pattern: '$OPTS = { ..., rejectUnauthorized: false, ... }'

  - id: no-hardcoded-secret-literal
    message: >-
      A literal credential assigned to a secret-shaped name. `pnpm security:secrets`
      also scans git history for these, and it is right to: a token that reached a
      commit reached every clone. Assemble fixtures at runtime instead, which is what
      `apps/api/src/test-support/synthetic-credentials.ts` does.
    severity: ERROR
    languages: [typescript, javascript]
    metadata:
      category: security
      cwe: 'CWE-798: Use of Hard-coded Credentials'
      confidence: MEDIUM
    patterns:
      # **Keyed on the name the value is assigned to, not on the length of the value.**
      #
      # The first version matched any quoted run of 28+ characters and reported **441
      # findings** across 110 files: `'quarantine_ttf_resolution_check'`,
      # `'00000000-0000-4000-8000-0000000000ff'`, every Drizzle column definition. An
      # identifier is not a credential, and a rule that cannot tell the two reports the
      # shape of the codebase rather than its security.
      #
      # It also tried to exempt test files with a `pattern-not-regex` naming `\.test\.` —
      # a **content** regex, matched against the matched text, so it could never have
      # exempted a path. Semgrep has `paths:` for that and the rule did not use it. A
      # mechanism that cannot work is worse than none, because it reads as one.
      #
      # So the rule matches the *name*, which is the approach `config.test.ts` takes in
      # TypeScript and `no-credential-in-web-storage` uses below. Test files stay **in**
      # scope, deliberately: `'development-only-cookie-secret-32-chars'` really is a
      # credential in a fixture, and AGENTS.md says fixtures are assembled at runtime.
      - pattern-either:
          - pattern: $OBJ.$SECRET_FIELD = $VALUE
          - pattern: $OBJ[$SECRET_FIELD] = $VALUE
          - pattern: $SECRET_FIELD = $VALUE
      - metavariable-regex:
          metavariable: $SECRET_FIELD
          regex: '(?i)^(.*_)?(secret|password|passwd|passphrase|token|hash|signature|signed|apikey|api_key|nonce|hmac|digest|credential|cookie|private_key)(_.*)?$'
      # A **string literal**, not any expression: `secret = readSecret()` is correct code,
      # and a rule that reports it teaches a reader to ignore it.
      - metavariable-regex:
          metavariable: $VALUE
          regex: '^[\x27"`][A-Za-z0-9+/=_-]{8,}[\x27"`]$'
      # `process.env.X` is the value a setting is *supposed* to have. This is a
      # `pattern-not` and it was originally written as a bare `pattern`, which is a
      # **positive** condition in a `patterns` list — so the rule only fired on an
      # assignment that *also* contained `process.env`, which is the safe shape. A
      # fourth rule in this file silently disabled by a plausible-looking line, and
      # the only reason it was found is that a probe fixture asks the rule to fire
      # and it does not.
      - pattern-not: 'process.env'
      # An ALL-CAPS underscore-separated token is an error code —
      # `REPORTER_SECRET_NOT_CONFIGURED` is 31 characters in the pattern's class, and
      # a client branches on it.
      - pattern-not-regex: '[\x27"`][A-Z][A-Z0-9]*(_[A-Z0-9]+)+[\x27"`]'
      # **A cookie *name* is not a cookie.** `SESSION_COOKIE = 'automate_session'` is a
      # published constant in three files, and `COOKIE_SECRET` next to it is a real
      # credential. Matching on the name alone cannot tell them apart, and a rule that
      # reports the cookie name teaches a reader to ignore the rule — which is the same
      # failure as the length heuristic, one level down.
      #
      # These name their own metavariables for the reason `no-unbounded-list-in-query`'s
      # exclusion does: a `pattern-not` that reuses the positive pattern's bindings
      # cannot match, because semgrep requires it to agree with them. `$OBJ.SESSION_COOKIE`
      # asked for `$OBJ` to be the `SESSION_COOKIE` identifier, and `$OBJ` was bound to
      # whatever object held the assignment — which for a bare declaration is nothing.
      - pattern-not: $EXCLUDED_OBJ.SESSION_COOKIE = $EXCLUDED_VALUE
      - pattern-not: $EXCLUDED_OBJ.COOKIE = $EXCLUDED_VALUE
      # Nor is a *name* constant a credential: `DEVELOPMENT_COOKIE_SECRET` in
      # `startup-policy.ts` is the documented development fallback whose entire purpose is
      # to be refused outside a test run and a developer's own machine. That refusal is
      # `startup-policy.test.ts`'s subject and it holds; the literal is the thing it
      # refuses.
      - pattern-not: $EXCLUDED_OBJ.DEVELOPMENT_COOKIE_SECRET = $EXCLUDED_VALUE
      - pattern-not: $EXCLUDED_OBJ.DEVELOPMENT_API_KEY = $EXCLUDED_VALUE
      # A **bare declaration**, which is how both constants above are actually written:
      # `const SESSION_COOKIE = '...'`. `$EXCLUDED_OBJ.SESSION_COOKIE` cannot match it,
      # because there is no object on the left — which is a seventh instance of the same
      # defect, and the one that made the rule report the constant its own comment says
      # is not a credential.
      - pattern-not: SESSION_COOKIE = $EXCLUDED_BARE_VALUE
      - pattern-not: COOKIE = $EXCLUDED_BARE_VALUE
      - pattern-not: DEVELOPMENT_COOKIE_SECRET = $EXCLUDED_BARE_VALUE
      - pattern-not: DEVELOPMENT_API_KEY = $EXCLUDED_BARE_VALUE

  - id: no-insecure-random-for-secret
    message: >-
      `Math.random()` where a security value is produced. It is a seeded PRNG,
      not a CSPRNG: the output is reproducible from a handful of observed values,
      so a session id or nonce derived from it can be guessed. Use
      `node:crypto`'s `randomUUID`/`randomBytes`, or `crypto.getRandomValues` in
      browser code.
    severity: WARNING
    languages: [typescript, javascript]
    metadata:
      category: security
      cwe: 'CWE-338: Use of Cryptographically Weak PRNG'
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: Math.random() as $X
          - pattern: $OBJ.secret = Math.random()
          - pattern: $OBJ.token = Math.random()
          - pattern: $OBJ.nonce = Math.random()
          - pattern: $OBJ.salt = Math.random()
      - pattern-not: $SERVICE.ingest($ID, Math.random())
      - pattern-not: $SERVICE.rerun($ID, Math.random())
      - pattern-not: $TEST.inject(Math.random())
      - pattern-not: $THIS.service.ingest($ID, Math.random())
      - pattern-not: $THIS.service.rerun($ID, Math.random())
      - pattern-not: $SERVICE.load($ID, Math.random())
      - pattern-not: $SERVICE.warm($ID, Math.random())
