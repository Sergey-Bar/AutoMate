# Semgrep rules for the Automate monorepo.
#
# Three of the six rules here were previously unparseable or unable to fire, so
# nothing was ever reported:
#
#   - `no-vault-password-log` used `where $X contains 'password'`. `contains` is
#     not a semgrep operator — the set operators are `<<` and `>>` — so the
#     clause never matched anything.
#   - `no-raw-sql-injection` declared `pattern` *and* `pattern-regex` at the rule
#     level. A rule may have one or the other, never both.
#   - `no-raw-sql-interpolation` then listed the `sql` tag in `pattern-either` and
#     excluded the same shape in `pattern-not`, so the inclusion was decorative
#     and the rule could not fire on the one case it appeared to cover.
#   - `no-comment-only-catch` excluded `...anything...`, a deep wildcard that
#     matches every catch block including the one it meant to catch, so the rule
#     could not fire at all. It was also redundant: semgrep discards comments, so a
#     comment-only catch is the same shape as an empty one, which `no-empty-catch`
#     already reports.
#
# `scripts/static-analysis-config-check.mjs` asserts those structural invariants —
# including the last two, which are about a rule contradicting itself rather than
# about a spelling semgrep rejects — so a future self-cancelling rule fails the
# build instead of looking like coverage. Invoke the real scanner with
# `pnpm security:semgrep`.

rules:
  - id: no-secret-in-log
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Potential secret exposure: a log call whose text mentions a credential.
      Remove the log, or log a redacted identifier instead of the value.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: 'CWE-532: Insertion of Sensitive Information into Log File'
    patterns:
      - pattern-either:
          - pattern: console.log(...)
          - pattern: console.error(...)
          - pattern: console.warn(...)
          - pattern: console.info(...)
          - pattern: console.debug(...)
      # Filters the matched region, not the file. `contains` is not a semgrep
      # operator; the previous spelling of this clause matched nothing.
      - pattern-regex: '(?i)(password|secret|apikey|api_key|decrypted|private_key|credential)'

  - id: no-raw-sql-interpolation
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      SQL built by interpolating a variable into a raw query string. Use a
      parameterized query: Drizzle's `sql` tag with bound parameters, or a
      prepared statement with placeholders.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: 'CWE-89: SQL Injection'
    patterns:
      - pattern-either:
          - pattern: $DB.execute(`...${...}...`)
          - pattern: $DB.query(`...${...}...`)
          - pattern: $DB.raw(`...${...}...`)
          - pattern: $DB.prepare(`...${...}...`)
          - pattern: $DB.unsafe(`...${...}...`)
      # The `sql` tag is deliberately absent, and the reason matters.
      #
      # This rule previously listed `sql`...${...}...`` in `pattern-either` and then
      # excluded the same shape with `pattern-not`. That made the inclusion
      # decorative and the exclusion load-bearing: the rule could never fire on a
      # `sql` tag even though it appeared to cover one. It is worse than redundant,
      # because a reader counting the covered cases would count 45 — the number of
      # `sql` tag interpolations in this tree — and conclude the rule guards them.
      #
      # It does not, and it should not. `sql` is a parameterised template tag: every
      # `${...}` in it is emitted as a bind parameter, never as literal SQL. All 45
      # uses here are the safe form. The genuinely dangerous shapes are the
      # member-function calls above, which build a string before it reaches the
      # driver. Those match nothing today, which is a true negative; they are kept
      # so that the first person to write one is caught.

  - id: no-string-concat-sql
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      SQL assembled by string concatenation. Use a parameterized query instead.
    metadata:
      category: security
      confidence: LOW
      cwe: 'CWE-89: SQL Injection'
    patterns:
      - pattern: $A + $B
      - metavariable-pattern:
          metavariable: $A
          patterns:
            - pattern-regex: '(?i)^\s*(SELECT|INSERT|UPDATE|DELETE|WHERE|FROM)\b'

  - id: no-empty-catch
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Empty catch block. Handle the error, log it, or rethrow. A swallowed
      exception is indistinguishable from success. A catch whose only content is a
      comment lands here too, because semgrep discards comments — the two are the
      same shape to this scanner.
    metadata:
      category: correctness
      confidence: HIGH
    pattern: |
      try { ... } catch ($ERR) { }

  - id: zod-parse-without-guard
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      parse() throws on invalid input, so every caller needs a try/catch. Prefer
      safeParse() and a classified error response; where a throw is genuinely
      intended, add a `// nosemgrep: zod-parse-without-guard` comment explaining
      why.
    metadata:
      category: correctness
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $SCHEMA.parse($INPUT)
          - pattern: $SCHEMA.array().parse($INPUT)
      - pattern-not-inside: |
          try { ... } catch ($$$) { ... }
