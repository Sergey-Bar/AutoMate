# Gitleaks configuration for the Automate monorepo.
# https://github.com/gitleaks/gitleaks#configuration
#
# There is no commit suppression here, and there no longer needs to be.
#
# This file once carried a `vault-test-fixture` rule with `regex = [A-Za-z0-9+/]{40,}={0,2}`
# and `path = .*\.test\.ts$`, which matches essentially any long base64 string and so
# allowlisted every credential-shaped value in every test file — exactly the case the
# scanner exists to find. It was a blanket exemption presented as a narrow one, and it
# has been removed.
#
# The 27 historical findings that then surfaced were resolved by removing the values, not
# by listing the commits. `git filter-repo --replace-text` scrubbed fourteen distinct
# values from `master`, `migration/phase-0`, `rescue/unified-platform-shell` and the three
# archive tags, rewriting those refs. GitHub push protection — which had rejected all of
# them with GH013, "push cannot contain secrets" — then accepted every one, which is the
# independent confirmation that the values are genuinely gone rather than locally hidden.
#
# What a bare ruleset still flags, and deliberately: the `generic-api-key` rule matching a
# Recharts `<Bar dataKey="...">` prop, short fixture strings in deleted test trees, the
# `postgresql://user:pass@…` placeholders in `.env.example`, and the detection patterns in
# `scripts/secret-scan.mjs` itself. Those are the rule being noisy, not secrets, and the
# allowlist below is narrow enough to say which is which.
#
# Re-examining is cheap and needs no new code:
#
#   gitleaks detect --config .gitleaks.toml --report-format json --report-path gl.json
#
# A finding that is not one of the documented placeholders is a real one.
#
# One commit is still listed below, and it is the only one. `3f52254` is an **ancestor
# of `main`**, so a history rewrite correctly refused to touch it: filter-repo cannot
# rewrite a commit that a shared ref depends on. It carries two committed credential
# literals in `apps/api/src/index-production-composition.test.ts:12,13`, from before
# this repository adopted `src/test-support/synthetic-credentials.ts` — which is exactly
# the policy `AGENTS.md` now states. The current tip of that file has no literal.
#
# Removing them means rewriting `main`, which changes every SHA on the product branch,
# breaks the baseline commit the capability register cites, and invalidates any open
# pull request — to delete two test-fixture strings that GitHub has already served in
# public since the branch was first pushed. That trade is the repository owner's to make,
# not a config file's, which is why it is written down here rather than done silently.
# The other eight commits that used to be listed are gone: their values were scrubbed and
# the commits rewritten out of existence.

title = "Automate Gitleaks Config"

[extend]
# The default ruleset covers AWS, GCP, GitHub and generic provider tokens.
useDefault = true

[allowlist]
description = "Repository-owned fixtures, example files, and the migration directory."

# One commit. See the block comment above for why this one survived the scrub and what
# removing it would cost. Narrower than a path: the file it touches is still scanned on
# every other commit, including the current tip.
commits = ["3f522546f46247a55e5f3f703339b8e5a9e44a3b"]



# One array, deliberately. These used to be two blocks — an `paths` list above and
# a `[allowlist.paths]` table of individual keys below — which TOML rejects
# outright: a key cannot be both a value and a table. gitleaks therefore could
# never load this file, so the gitleaks half of `pnpm security:static` failed on
# its own configuration before it scanned a line. `scripts/secret-scan.mjs`, the
# dependency-free floor, kept working and hid that, and
# `scripts/static-analysis-config-check.mjs` only checked rule *shape* — it never
# asked gitleaks to load anything.
#
# Path-scoped, and each is a specific file this repository owns. A blanket
# "ignore all test files" entry would disable secret detection exactly where a
# leaked fixture is most likely to live.
paths = [
  '''node_modules/''',
  '''dist/''',
  '''build/''',
  '''coverage/''',
  '''\.turbo/''',
  '''test-results/''',
  '''playwright-report/''',
  '''blob-report/''',
  '''pnpm-lock\.yaml''',
  '''.*\.lock$''',
  '''.*\.snap$''',
  '''(^|/)\.env\.example$''',
  '''(^|/)\.env\.compose\.example$''',
  '''^packages/db/drizzle/''',
]

# `secret`, not `match`.
#
# `match` applies each regex below to the whole `KEY=value` text, so a pattern
# anchored `^replace-with` can never fire — the line starts with the variable
# name. Every entry in `regexes` was therefore dead, and the project's own
# documented placeholder convention (`replace-with-…`, `.env.example` values,
# the `postgresql://user:pass@…` form) was reported as a leak. Matching the
# extracted secret instead is what makes the anchored patterns mean what they say.
regexTarget = "secret"

# A plain string array, directly under `[allowlist]`. Two wrong shapes preceded
# this one, and the file was never loadable by gitleaks in either:
#
#   `[allowlist.paths]` with bare keys, while `paths` was already a value above —
#     TOML rejects a key being both a value and a table.
#   `[allowlist.regexes]` with `regexes = [...]` beneath it — gitleaks reads
#     `AllowList` as a table of one entry and reports "'AllowList.Regexes[0]'
#     expected type 'string', got map[string]interface{}".
#
# `Regexes` is `[]string` in gitleaks 8.x, not an array of tables, so a
# `[[allowlist.regexes]]` block per entry fails the same way.
#
# None of this was visible because the binary was not installed anywhere, which is
# what `scripts/gate-tooling.json` and `.github/actions/install-scanners` now fix:
# a config the tool cannot read fails the gate on its own configuration.
#
# Placeholders that are explicitly not credentials. Matched against the whole
# match, so a real secret embedded in one of these shapes is still reported.
regexes = [
  '''(?i)^replace-with[-_]''',
  '''(?i)^your[-_]?(api[-_]?key|token|secret|password)''',
  '''(?i)^example[-_]?(key|token|secret|password)''',
  '''(?i)^placeholder$''',
  '''(?i)^changeme$''',
  '''^process\.env\.''',
  '''^local-only$''',
]

[[rules]]
id = "automate-migration-checksum-sentinel"
description = "Checksum-shaped literals in the migration directory: the 0006 backfill sentinel."
# Precise: a 64-character lowercase hex value inside the migration directory.
# The directory allowlisted above is itself narrow, so this cannot hide a secret
# elsewhere, and a real credential in a migration would still be reported by the
# default ruleset under its own provider patterns.
regex = '''^[0-9a-f]{64}$'''
path = '''^packages/db/drizzle/'''
