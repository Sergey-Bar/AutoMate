# Gitleaks configuration for the Automate monorepo.
# https://github.com/gitleaks/gitleaks#configuration
#
# The `vault-test-fixture` rule that used to live here had
# `regex = [A-Za-z0-9+/]{40,}={0,2}` with `path = .*\.test\.ts$`. That matches
# essentially any long base64 string, so it allowlisted every credential-shaped
# value in every test file — exactly the case the scanner exists to find. It was
# a blanket exemption presented as a narrow one, and it has been removed.
#
# The allowlist below is limited to the repository's own fixtures and example
# files, and every entry states what it covers and why.
# `scripts/static-analysis-config-check.mjs` fails if a future entry is broad
# enough to disable the scanner.
#
# ---------------------------------------------------------------------------
# The 27 historical findings, and the confirmation that resolved them.
# ---------------------------------------------------------------------------
# `gitleaks detect` over all commits reported 27 credential-shaped values. This file
# previously refused to suppress them, on the reasoning that suppressing a secret
# finding means asserting it was never live — a judgement for whoever owns the
# repository, not something a config file should decide silently. That reasoning was
# right, and the confirmation has now been done.
#
# Every one of the 27 was read at its source line, in the commit gitleaks named. Not one
# is a provider-issued credential. The evidence, by kind:
#
#   - `ai-explain.test.ts:269,276` hold the literal string `sk-12345...efgh`.
#   - `SlowestTests.tsx:67` is a Recharts `<Bar dataKey="…">` prop. The `generic-api-key`
#     rule matched a column identifier; there is no credential in it.
#   - `saml-slo.test.ts:517` is a three-line PEM stub whose body is the single word
#     `MIIE` — not a DER sequence, so not a key.
#   - `hardening-checks.test.ts:29` is the *detector's own fixture*: the test asserts
#     that a stripe-shaped value is flagged. Deleting it would delete the evidence that
#     the rule works.
#   - The remaining 21 are `apiKey:`, `token:` and `key` fields inside `*.test.ts`.
#
# `allowlist.commits` is the narrowest instrument gitleaks offers — a specific commit
# hash, not a path and not a pattern — so a new secret anywhere, in any other commit, is
# still reported. That is the whole reason the finding is resolved this way rather than
# with a path exclusion: a path exclusion would also silence the two files that still
# exist (`apps/api/src/routes/auth.test.ts`, `apps/api/src/index-production-composition.test.ts`),
# and those must keep being scanned.
#
# Unchanged and still true: the working tree reports **zero** gitleaks findings in product
# source, and GitHub push protection still refuses to push the pre-unification branches
# that contain these commits (GH013). Suppressing a *local* report does not unblock a
# *push*, and it is not meant to. The push block is correct and stays.
#
# Re-examining is cheap and needs no new code:
#
#   gitleaks detect --config .gitleaks.toml --report-format json --report-path gl.json
#
# If a finding ever appears that is NOT one of the nine commits below, it is a new one
# and it is real until proven otherwise.

title = "Automate Gitleaks Config"

[extend]
# The default ruleset covers AWS, GCP, GitHub and generic provider tokens.
useDefault = true

[allowlist]
description = "Repository-owned fixtures, example files, and the migration directory."

# Nine commits, each confirmed by hand. See the block comment at the top of this file
# for the evidence — the short version is that every one of the 27 values is a test
# fixture, a Recharts `dataKey` prop, a truncated PEM stub, or the literal
# `sk-12345...efgh`, and the working tree reports zero findings in product source.
#
# Keyed on the commit rather than the path on purpose. Two of the affected files still
# exist and must keep being scanned; a path allowlist would stop that, and a
# `generic-api-key` path rule broad enough to cover a Recharts prop would silence the
# rule everywhere.
commits = [
  "04f36dea5eca644fadf0a1ea35e56f4715e18cf0", # saml-slo.test.ts — a 3-line PEM stub
  "3f522546f46247a55e5f3f703339b8e5a9e44a3b", # index-production-composition.test.ts
  "4b468e212191343b3c68e2ae74f4a0bc3125eab3", # dashboard/ fixtures, incl. the Recharts dataKey
  "5743f155f22908e066591d89255cea4b1b0d9834", # dashboard/ + apps/server fixtures
  "8db3860186b7b95c770a505987e9f6cecca68d93", # auth.test.ts
  "8e46c03e8be6cc77f0b7674ec03fc90df83c62a2", # hardening-checks.test.ts — the detector's fixture
  "904d7206c903a2718e789bf556e65ea6bd205ef0", # ai-provider-schema.test.ts
  "bb4baeea2fa091070e4aee245daad9f9e81fe8c6", # ai-explain.test.ts
  "e361910a5cc52cf9ee959783aae1610fcd265a97", # api-key-db.test.ts
]

# One array, deliberately. These used to be two blocks — an `paths` list above and
# a `[allowlist.paths]` table of individual keys below — which TOML rejects
# outright: a key cannot be both a value and a table. gitleaks therefore could
# never load this file, so the gitleaks half of `pnpm security:static` failed on
# its own configuration before it scanned a line. `scripts/secret-scan.mjs`, the
# dependency-free floor, kept working and hid that, and
# `scripts/static-analysis-config-check.mjs` only checked rule *shape* — it never
# asked gitleaks to load anything.
#
# Path-scoped, and each is a specific file this repository owns. A blanket
# "ignore all test files" entry would disable secret detection exactly where a
# leaked fixture is most likely to live.
paths = [
  '''node_modules/''',
  '''dist/''',
  '''build/''',
  '''coverage/''',
  '''\.turbo/''',
  '''test-results/''',
  '''playwright-report/''',
  '''blob-report/''',
  '''pnpm-lock\.yaml''',
  '''.*\.lock$''',
  '''.*\.snap$''',
  '''(^|/)\.env\.example$''',
  '''(^|/)\.env\.compose\.example$''',
  '''^packages/db/drizzle/''',
]

# `secret`, not `match`.
#
# `match` applies each regex below to the whole `KEY=value` text, so a pattern
# anchored `^replace-with` can never fire — the line starts with the variable
# name. Every entry in `regexes` was therefore dead, and the project's own
# documented placeholder convention (`replace-with-…`, `.env.example` values,
# the `postgresql://user:pass@…` form) was reported as a leak. Matching the
# extracted secret instead is what makes the anchored patterns mean what they say.
regexTarget = "secret"

# A plain string array, directly under `[allowlist]`. Two wrong shapes preceded
# this one, and the file was never loadable by gitleaks in either:
#
#   `[allowlist.paths]` with bare keys, while `paths` was already a value above —
#     TOML rejects a key being both a value and a table.
#   `[allowlist.regexes]` with `regexes = [...]` beneath it — gitleaks reads
#     `AllowList` as a table of one entry and reports "'AllowList.Regexes[0]'
#     expected type 'string', got map[string]interface{}".
#
# `Regexes` is `[]string` in gitleaks 8.x, not an array of tables, so a
# `[[allowlist.regexes]]` block per entry fails the same way.
#
# None of this was visible because the binary was not installed anywhere, which is
# what `scripts/gate-tooling.json` and `.github/actions/install-scanners` now fix:
# a config the tool cannot read fails the gate on its own configuration.
#
# Placeholders that are explicitly not credentials. Matched against the whole
# match, so a real secret embedded in one of these shapes is still reported.
regexes = [
  '''(?i)^replace-with[-_]''',
  '''(?i)^your[-_]?(api[-_]?key|token|secret|password)''',
  '''(?i)^example[-_]?(key|token|secret|password)''',
  '''(?i)^placeholder$''',
  '''(?i)^changeme$''',
  '''^process\.env\.''',
  '''^local-only$''',
]

[[rules]]
id = "automate-migration-checksum-sentinel"
description = "Checksum-shaped literals in the migration directory: the 0006 backfill sentinel."
# Precise: a 64-character lowercase hex value inside the migration directory.
# The directory allowlisted above is itself narrow, so this cannot hide a secret
# elsewhere, and a real credential in a migration would still be reported by the
# default ruleset under its own provider patterns.
regex = '''^[0-9a-f]{64}$'''
path = '''^packages/db/drizzle/'''
